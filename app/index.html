/* ------------------------------------------------------------------- state */
async function saveState(extra = {}) {
  if (!DB || !USER_ID) return;
  try {
    await DB.doc(`data/users/${USER_ID}/prefs`).set({
      myTeam: S.myTeam, tab: S.tab, ...extra, savedAt: new Date().toISOString(),
    });
  } catch {}
}

async function loadState() {
  if (!DB || !USER_ID) return null;
  try {
    const snap = await DB.doc(`data/users/${USER_ID}/prefs`).get();
    return snap.exists ? snap.data() : null;
  } catch { return null; }
}

/* Leagues the viewer connected themselves. On claude.ai they last for the
   session; the standalone build swaps these for localStorage. */
function saveConnected(lg) {
  try {
    if (!DB || !USER_ID) return;
    DB.doc(`data/users/${USER_ID}/league_${lg.key}`).set({
      key: lg.key, source: lg.source, league_id: lg.league_id,
      my_team: lg.my_team, savedAt: new Date().toISOString(),
    });
  } catch {}
}
function loadConnected() { return []; }

/* Manually entered rosters.
   Written to browser storage always and to the artifact's own store when one is
   available, then read back store-first. Typing a roster in and losing it on
   reload would be worse than not offering the feature, so this does not depend
   on a capability that may or may not have resolved. */
const MANUAL_KEY = "sacko.rosters";

function saveManual(map) {
  const savedAt = new Date().toISOString();
  // Stamp both stores. Without a timestamp there is no way to tell a paste
  // made ten minutes ago from one made three data builds back, and the newer
  // of the two has to win.
  try { localStorage.setItem(MANUAL_KEY, JSON.stringify({ map: map || {}, savedAt })); }
  catch {}
  try {
    if (DB && USER_ID)
      DB.doc(`data/users/${USER_ID}/rosters`).set({ map, savedAt });
  } catch {}
}

async function loadManual() {
  try {
    if (DB && USER_ID) {
      const snap = await DB.doc(`data/users/${USER_ID}/rosters`).get();
      if (snap.exists && snap.data().map)
        return { map: snap.data().map, savedAt: snap.data().savedAt || null };
    }
  } catch {}
  try {
    const raw = JSON.parse(localStorage.getItem(MANUAL_KEY) || "null");
    if (!raw) return null;
    // a pre-stamp save is a bare map, and counts as older than any build
    return raw.map ? raw : { map: raw, savedAt: null };
  } catch { return null; }
}

/* ============================================================ live scoring
   In-game updates, from whichever platform the active league is on.

   This runs in BOTH builds and simply tries. Whether a published claude.ai
   page may call an outside API is a property of the page's sandbox that this
   session cannot test from here, and the honest thing is to attempt the call
   and report what actually happened rather than to assume a refusal and show a
   projection forever. When the call is blocked the card says so in plain
   words; when it works the scores move.

   Sleeper hands back each roster's running total and every starter's points.
   ESPN carries the same thing inside the scoring-period matchup view as
   `appliedStatTotal`, alongside the real head-to-head pairings and each side's
   actual lineup — so for an ESPN league this is also the only place the app
   ever learns who is really playing whom. */

const LIVE_TIMEOUT = 9000;

async function grabJSON(url, creds) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), LIVE_TIMEOUT);
  try {
    const r = await fetch(url, {
      signal: ctl.signal, cache: "no-store",
      ...(creds ? { credentials: creds } : {}),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

/** A player's points so far this week, out of an ESPN roster entry. */
function espnApplied(entry, wk) {
  const pe = entry.playerPoolEntry || entry;
  if (typeof pe.appliedStatTotal === "number") return pe.appliedStatTotal;
  const pl = pe.player || {};
  for (const s of pl.stats || []) {
    // statSourceId 0 is actual (1 is projected); splitType 1 is this week
    if (s.statSourceId === 0 && s.statSplitTypeId === 1
        && Number(s.scoringPeriodId) === Number(wk)
        && typeof s.appliedTotal === "number") return s.appliedTotal;
  }
  return null;
}

/** ESPN: live points, real pairings, real starting lineups. */
async function fetchEspnLive(lg, wk) {
  const season = lg.season || S.meta.season;
  const url = "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/"
    + season + "/segments/0/leagues/" + encodeURIComponent(lg.league_id)
    + "?view=mMatchupScore&scoringPeriodId=" + wk;
  let data = null, lastErr = null;
  for (const creds of ["include", "omit"]) {
    try { data = await grabJSON(url, creds); break; }
    catch (e) { lastErr = e; }
  }
  if (!data) throw lastErr || new Error("no answer");

  const pts = {}, pairs = [], by_roster = {};
  let scored = 0;
  for (const g of data.schedule || []) {
    if (Number(g.matchupPeriodId) !== Number(wk)) continue;
    const sides = [g.home, g.away].filter(s => s && s.teamId != null);
    if (sides.length !== 2) continue;
    const mid = String(g.id != null ? g.id : pairs.length + 1);
    pairs.push({ matchup_id: mid, rosters: sides.map(s => String(s.teamId)) });
    for (const side of sides) {
      const entries = ((side.rosterForCurrentScoringPeriod
        || side.rosterForMatchupPeriod || {}).entries) || [];
      const starters = [];
      for (const e of entries) {
        const p = matchEspn(e);
        if (!p) continue;
        const v = espnApplied(e, wk);
        if (v != null) { pts[p.id] = v; if (v) scored++; }
        const slot = ESPN_SLOT[e.lineupSlotId];
        if (slot && slot !== "BN" && slot !== "IR") starters.push(p.id);
      }
      by_roster[String(side.teamId)] = {
        matchup_id: mid,
        points: typeof side.totalPoints === "number" ? side.totalPoints : 0,
        starters,
      };
    }
  }
  if (!pairs.length) throw new Error("no week " + wk + " matchups in the response");
  return { pts, scored, matchups: { pairs, by_roster } };
}

/** Sleeper: the matchups endpoint carries points per roster and per player. */
async function fetchSleeperLive(lg, wk) {
  const rows = await grabJSON("https://api.sleeper.app/v1/league/"
    + encodeURIComponent(lg.league_id) + "/matchups/" + wk);
  if (!Array.isArray(rows) || !rows.length) throw new Error("no matchups");

  const pts = {}, groups = {}, by_roster = {};
  let scored = 0;
  for (const row of rows) {
    const pp = row.players_points || {};
    for (const id in pp) { pts[String(id)] = pp[id]; if (pp[id]) scored++; }
    const rid = String(row.roster_id);
    by_roster[rid] = {
      matchup_id: row.matchup_id == null ? "" : String(row.matchup_id),
      points: row.points || 0,
      starters: (row.starters || []).map(String),
    };
    if (row.matchup_id != null) {
      const k = String(row.matchup_id);
      (groups[k] = groups[k] || []).push(rid);
    }
  }
  return {
    pts, scored,
    matchups: {
      pairs: Object.keys(groups).map(id => ({ matchup_id: id, rosters: groups[id] })),
      by_roster,
    },
  };
}

/* --------------------------------------------------------- the relay route
   A published claude.ai artifact cannot call an outside API: the capability
   set it can be granted — artifact, assets, comments, db, downloads, mcp,
   room, sample, self, user — contains nothing that fetches a URL, and external
   hosts are blocked besides. So the page's own call to Sleeper works in the
   downloaded file and not in the published one, and no amount of polling
   changes that.

   What the published page CAN do is read its own data store. A scheduled task
   reaches Sleeper, and writes this week's points into `live/<league key>`
   through the same `db` the page already uses for preferences. The page
   subscribes and the numbers arrive with no outbound call — a relay, not a
   fetch. Writing to the store needs no republish, so the task is cheap and can
   run often; its freshness is whatever the task's interval is, and the card
   says so rather than implying the numbers are instant. */

/* How old a relay payload may be before it stops being this week's score and
   becomes history. This tracks the relay's ACTUAL cadence, which is whatever
   the scheduled task runs at — hourly, because that is the floor this account's
   scheduler allows. A window shorter than the cadence would blank the score for
   most of every hour, which is worse than showing a known-old number; a much
   longer one would still be showing Sunday's score on Tuesday. So: the cadence
   plus slack for a late run.

   A stale relay score is always an UNDERSTATEMENT, never an overstatement —
   points only accumulate within a week — which is why showing it with its age
   is honest and showing it without one would not be. */
const RELAY_MAX_AGE_MS = 75 * 60 * 1000;

/** Past this, a relayed number is reported with its age instead of as "live". */
const RELAY_LIVE_MS = 3 * 60 * 1000;

let _relayUnsub = null;

/** Subscribe to the active league's relay document. Re-subscribed when the
    league changes, because the document path changes with it — never from
    render, which would open a new subscription on every repaint. */
function subscribeRelay() {
  if (_relayUnsub) { try { _relayUnsub(); } catch {} _relayUnsub = null; }
  const lg = S.league;
  if (!DB || !lg || !lg.key) return;
  let ref;
  try { ref = DB.doc("live/" + lg.key); } catch { return; }   // bad path: give up
  _relayUnsub = ref.onSnapshot(snap => {
    S.relay = snap.exists ? (snap.data() || null) : null;
    applyLive();
  }, err => {
    _relayUnsub = null;
    S.relayErr = (err && err.code) || "unavailable";
    applyLive();
  });
}

const rosterTotals = mu => {
  if (!mu || !mu.by_roster) return null;
  const out = {};
  for (const rid in mu.by_roster) {
    const v = mu.by_roster[rid].points;
    if (typeof v === "number") out[rid] = v;
  }
  return Object.keys(out).length ? out : null;
};

/**
 * Settle on one set of live points.
 *
 * Both routes can be carrying numbers at once, and they can disagree — the
 * relay is a snapshot from minutes ago, a direct call is from seconds ago. So
 * take the FRESHER, and only after checking it is this week's: a payload left
 * over from last week would quietly restate a finished week as a live one.
 *
 * An all-zero response before kickoff is an empty week, not a live feed;
 * treating it as live would report every game as finished with no points. So
 * neither route sets `livePoints` until something has actually scored.
 */
function applyLive() {
  const wk = Number(S.meta.upcoming_week);
  const direct = (S.directPts && Number(S.directWeek) === wk)
    ? { pts: S.directPts, totals: S.directTotals, at: S.directAt, src: "direct" }
    : null;

  let relay = null;
  const r = S.relay;
  if (r && Number(r.week) === wk && r.pts && Object.keys(r.pts).length) {
    const at = Date.parse(r.at || "");
    if (at && Date.now() - at < RELAY_MAX_AGE_MS)
      relay = { pts: r.pts, totals: r.totals || null, at: new Date(at), src: "relay" };
  }

  const pick = (direct && relay)
    ? (direct.at >= relay.at ? direct : relay)
    : (direct || relay);

  S.livePoints = pick ? pick.pts : null;
  S.liveTotals = pick ? pick.totals : null;
  S.liveAt = pick ? pick.at : null;
  S.liveSrc = pick ? pick.src : null;
  if (S.tab === "matchup") renderMatchup();
}

/**
 * One poll of the active league, over this browser's own connection.
 *
 * Guarded against overlap: a call that takes longer than the interval must not
 * stack a second one behind it, or a slow network turns into a queue of
 * requests that all land at once and fight over the render.
 */
let _pollInFlight = false, _failStreak = 0;

async function pollLive() {
  const lg = S.league;
  S.liveErr = null;
  if (!lg || !lg.league_id) { S.canPollLive = false; return; }
  // Polling a finished week fetches last week's final scores, which is exactly
  // what a stale copy must not present as current. Nothing to poll until the
  // data catches up.
  if (staleWeek()) { S.canPollLive = false; return; }
  if (_pollInFlight) return;
  _pollInFlight = true;
  const wk = S.meta.upcoming_week;

  try {
    const out = lg.source === "espn"
      ? await fetchEspnLive(lg, wk)
      : await fetchSleeperLive(lg, wk);

    S.canPollLive = true;
    _failStreak = 0;

    // Real pairings and lineups, whatever the shipped snapshot guessed at.
    if (out.matchups && out.matchups.pairs.length) {
      lg.matchups = Object.assign({}, lg.matchups);
      lg.matchups[String(wk)] = out.matchups;
    }
    S.directPts = out.scored ? out.pts : null;
    S.directTotals = out.scored ? rosterTotals(out.matchups) : null;
    S.directAt = new Date();
    S.directWeek = wk;
  } catch (err) {
    S.canPollLive = false;
    _failStreak++;
    S.liveErr = String((err && err.message) || err);
  } finally {
    _pollInFlight = false;
  }
  // Either way, re-settle: a failed direct call does not invalidate the relay.
  applyLive();
}

/** Is a game running right now, among the teams given? */
function anyRunning(teams) {
  const k = S.kick && S.kick[String(S.meta.upcoming_week)];
  if (!k) return false;
  const now = Date.now();
  return (teams || Object.keys(k)).some(t => {
    const g = k[t];
    return g && now >= Date.parse(g.kick) && now < Date.parse(g.end);
  });
}

/** Are any of this week's games running right now? */
const gamesRunning = () => anyRunning(null);

/**
 * Is a game running that this matchup actually depends on?
 *
 * The teams in the two starting lineups are the only ones whose clock matters.
 * Polling every fifteen seconds through a Sunday night game that neither side
 * has a player in buys nothing, and late in a week that is most of the slate.
 * Falls back to the whole slate when the lineups aren't known.
 */
function myGamesRunning() {
  const lg = S.league;
  if (!lg || !lg.rosters) return gamesRunning();
  const mu = lg.matchups && lg.matchups[String(S.meta.upcoming_week)];
  const ids = [];
  const r = me();
  if (r) ids.push(...(((mu && mu.by_roster && mu.by_roster[r.id]) || {}).starters
    || r.starters || r.players || []));
  if (mu && mu.by_roster) {
    const pair = (mu.pairs || []).find(x => r && x.rosters.includes(r.id));
    const oppId = pair && pair.rosters.find(x => !r || x !== r.id);
    if (oppId) ids.push(...((mu.by_roster[oppId] || {}).starters || []));
  }
  const teams = [...new Set(ids.map(i => (S.byId.get(i) || {}).team).filter(Boolean))];
  return teams.length ? anyRunning(teams) : gamesRunning();
}

/* Pace the polling by what is actually happening.

   As live as it can be where it matters: 15s while a game this matchup depends
   on is running AND the matchup tab is the one on screen. Reading another tab
   drops to 45s, because the numbers are not in front of them. No game in
   progress is 5 minutes. Hidden is nothing at all — a phone in a pocket should
   not hit an API every fifteen seconds, and browsers throttle background timers
   regardless. Coming back polls at once, which is what glancing at a phone
   between drives actually wants.

   Failures back off, doubling to a 5-minute ceiling. In a published artifact
   the direct call is blocked permanently, so without a backoff the page would
   retry a call that cannot ever succeed four times a minute for as long as it
   stayed open; the relay keeps updating meanwhile, on its own subscription. */
const LIVE_FAST = 15000, LIVE_BG = 45000, LIVE_IDLE = 300000, LIVE_MAX = 300000;

function liveDelay() {
  if (_failStreak) return Math.min(LIVE_MAX, LIVE_FAST * Math.pow(2, _failStreak));
  if (!myGamesRunning()) return LIVE_IDLE;
  return S.tab === "matchup" ? LIVE_FAST : LIVE_BG;
}

let _liveTimer = null;
function scheduleLive() {
  clearTimeout(_liveTimer);
  _liveTimer = null;
  if (document.hidden) return;
  _liveTimer = setTimeout(() => { pollLive().then(scheduleLive); }, liveDelay());
}

function startLive() {
  pollLive().then(scheduleLive);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(_liveTimer); return; }
    pollLive().then(scheduleLive);
  });
}

/** The line under the score that says where these numbers came from, by which
    route, and how old they are. A number whose age isn't stated reads as
    instant, and a relayed number never is. */
function liveStatus() {
  const lg = S.league;
  const ago = S.liveAt
    ? Math.max(0, Math.round((Date.now() - S.liveAt.getTime()) / 1000)) : null;
  const when = ago == null ? ""
    : ago < 60 ? `${ago}s ago`
    : ago < 5400 ? `${Math.round(ago / 60)} min ago`
    : `${Math.round(ago / 3600)}h ago`;
  const refresh = `<button class="btn ghost sm" data-relive>Refresh</button>`;
  const cadence = myGamesRunning()
    ? (S.tab === "matchup" ? "every 15s while you're on this tab" : "every 45s")
    : "every 5 min — no game of yours is in progress";

  if (S.livePoints && S.liveSrc === "direct")
    return `<div class="row" style="justify-content:space-between">
      <span class="sub"><span class="chip good">live</span> ${esc(lg.platform)},
        updated ${esc(when)} · checking ${esc(cadence)}</span>${refresh}</div>`;

  if (S.livePoints && S.liveSrc === "relay") {
    // Only a relayed score that just landed is "live". Past a few minutes the
    // badge states its age instead, because the scheduled relay runs hourly —
    // calling a 40-minute-old number live would be a claim the cadence can't
    // support. It can only be an understatement: points don't come back off.
    const fresh = ago != null && ago * 1000 < RELAY_LIVE_MS;
    return `<div class="row" style="justify-content:space-between">
      <span class="sub"><span class="chip ${fresh ? "good" : ""}">${
        fresh ? "live" : esc(when)}</span> relayed from ${esc(lg.platform)}${
        fresh ? "" : ` — scores as of ${esc(when)}, and can only have gone up since`}.
        This page can't call ${esc(lg.platform)} itself, so the scheduled refresh
        writes the scores into its own store hourly during games.</span>${refresh}</div>`;
  }

  if (S.canPollLive)
    return `<div class="row" style="justify-content:space-between">
      <span class="sub">Connected to ${esc(lg.platform)} — nothing has scored yet,
        so these are projections. Checking ${esc(cadence)}.</span>${refresh}</div>`;

  // Only Sleeper is relayed. The scheduled task that writes live scores into
  // this page's store reads Sleeper; ESPN's matchup payload truncates through
  // the relay and can't be read whole. Telling an ESPN viewer that the refresh
  // "writes live scores here" promised scores that would never arrive.
  const relayed = lg.source !== "espn";
  return `<div class="sub">This copy can't reach ${esc(lg.platform)} directly${
    S.liveErr ? ` <span class="mono">(${esc(S.liveErr)})</span>` : ""}, so these
    are projections. ${relayed
      ? `No relayed score for Week ${esc(String(S.meta.upcoming_week))} has arrived
         yet — the scheduled refresh writes live scores here hourly during games.`
      : `Live ${esc(lg.platform)} scores aren't relayed to this page: its matchup
         data can't be read whole from where the scheduled refresh runs.`}
    The downloaded file calls ${esc(lg.platform)} itself during games.
    ${refresh}</div>`;
}

/* -------------------------------------------------------------------- boot */
async function boot() {
  const [players, schedule, picks, meta, leagues] = await Promise.all(
    ["players", "schedule", "picks", "meta", "leagues"].map(f => loadJSON(`data/${f}.json`)));

  S.players = players; S.byId = new Map(players.map(p => [p.id, p]));
  S.sched = schedule.sched; S.dvp = schedule.dvp; S.byes = schedule.byes;
  S.kick = schedule.kickoffs || null;
  S.picks = picks; S.meta = meta; S.leagues = leagues;
  // Keep the rosters as shipped, before any paste is laid over them, so the
  // viewer can always get back to them in one tap.
  for (const lg of S.leagues)
    lg._shipped = Object.fromEntries(
      lg.rosters.map(r => [r.id, (r.players || []).slice()]));
  S.league = leagues.find(hasRosters) || leagues[0];
  S.myTeam = S.league.my_team || (S.league.rosters[0] || {}).id || null;

  $("#leagueLabel").textContent = `${S.league.platform} · ${S.league.name}`;

  // browser-stored rosters are available before any capability resolves
  applyManual(await loadManual());
  if (!hasRosters(S.league)) {
    const better = S.leagues.find(hasRosters);
    if (better) { S.league = better; S.myTeam = better.my_team || S.myTeam; }
  }
  $("#leagueLabel").textContent = `${S.league.platform} · ${S.league.name}`;

  renderTabs();
  $("#tabbar").addEventListener("click", e => {
    const b = e.target.closest("[data-tab]"); if (b) show(b.dataset.tab);
  });
  document.addEventListener("click", e => {
    const ex = e.target.closest("[data-export]");
    if (ex && !ex.closest(".sheet")) { exportXlsx(ex.dataset.export); return; }
    const go = e.target.closest("[data-goto]");
    if (go) { show(go.dataset.goto); return; }
    const sw = e.target.closest("[data-league]");
    if (sw && !sw.closest(".sheet")) { switchLeague(sw.dataset.league); return; }
    const rl = e.target.closest("[data-relive]");
    if (rl) { rl.disabled = true; rl.textContent = "…";
      pollLive().then(scheduleLive); return; }
    const sh = e.target.closest("[data-shipped]");
    if (sh) { useShippedRoster(sh.dataset.shipped); return; }
    const ed = e.target.closest("[data-roster]");
    if (ed) { openRosterEditor(ed.dataset.roster || (me() || {}).id); return; }
    const ep = e.target.closest("[data-espn]");
    if (ep) { loadEspnInline(ep, ep.dataset.espn); return; }
    const row = e.target.closest("[data-player]");
    if (row && !e.target.closest("button, a, input, select")) openPlayer(row.dataset.player);
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest && e.target.closest("[data-player]");
    if (row) { e.preventDefault(); openPlayer(row.dataset.player); }
  });
  $("#btnConnect").addEventListener("click", openConnect);
  $("#btnTheme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("ss.theme", next); } catch {}
  });

  restoreFilters();
  if (hasRosters(S.league)) seedTrade();

  let start = "matchup";
  try { start = localStorage.getItem("ss.tab") || "matchup"; } catch {}
  show(TABS.some(([k]) => k === start) ? start : "matchup");

  startLive();

  // capabilities resolve after first paint; the page is fully usable without them
  (async () => {
    const use = async name => {
      try { return (await window.claude?.use?.(name)) ?? null; } catch { return null; }
    };
    [DOWNLOADS, DB] = await Promise.all(["downloads", "db"].map(use));
    const u = await use("user");
    if (u) { try { USER_ID = await u.id(); } catch { USER_ID = null; } }
    // The store is also the live-score relay — subscribe as soon as it resolves.
    subscribeRelay();
    applyManual(await loadManual());
    const saved = await loadState();
    if (saved?.leagueKey && S.leagues.some(l => l.key === saved.leagueKey)) {
      switchLeague(saved.leagueKey);
    }
    if (saved?.myTeam && S.league.rosters.some(r => r.id === saved.myTeam)) {
      S.myTeam = saved.myTeam; show(S.tab);
    }
  })();
}

try { const t = localStorage.getItem("ss.theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
boot().catch(err => {
  $("main").innerHTML = `<div class="card pad"><div class="h-sec">Couldn't load the data</div>
    <div class="sub">${esc(err.message)}</div></div>`;
});
</script>
