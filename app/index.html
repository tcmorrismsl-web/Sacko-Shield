    p.inj_note ? " · " + esc(p.inj_note) : ""}</span>`;
}
const oppTxt = p => p.opp ? `${p.home ? "vs" : "@"} ${p.opp}` : "no game";

function nameCell(p) {
  return `<span class="pos ${p.pos}">${p.pos}</span>
    <span>${esc(p.name)}</span>${injChip(p)}`;
}

/* ------------------------------------------------------------ which week
   Every number in this copy belongs to one NFL week — `meta.upcoming_week`,
   fixed when the data was built. That used to be the only notion of "this
   week" the app had, so a copy built for Week 3 went on presenting Week 3 as
   current indefinitely: the downloaded file did exactly that, on a phone, with
   nothing on screen to say so.

   So the app now also asks the clock. A week runs until its last game has
   ended; the first week whose last game hasn't ended is the one being played.
   When that is later than the week this copy was built for, the data is last
   week's, and the app says so on every tab instead of passing it off as
   current. */

/** The NFL week being played right now, from the kickoff schedule. */
function clockWeek() {
  const k = S.kick;
  if (!k) return null;
  const now = Date.now();
  const weeks = Object.keys(k).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
  for (const w of weeks) {
    const ends = Object.values(k[String(w)] || {})
      .map(g => Date.parse(g.end)).filter(Number.isFinite);
    if (ends.length && Math.max(...ends) > now) return w;
  }
  return null;                                   // the regular season is over
}

/** The week this copy's projections, pairings and lineups were built for. */
const dataWeek = () => Number(S.meta.upcoming_week) || null;

/** The current week, when it is LATER than the data — i.e. the data is stale. */
function staleWeek() {
  const c = clockWeek(), d = dataWeek();
  return (c && d && c > d) ? c : null;
}

const isStandalone = () => typeof STANDALONE !== "undefined" && STANDALONE;

/** What to do about it, which depends on which copy this is. */
function staleRemedy(c) {
  return isStandalone()
    ? `A downloaded copy never updates itself. Open Sacko Shield in Claude for
       Week ${c} — that page is rebuilt on a schedule.`
    : `The next scheduled rebuild brings in Week ${c}.`;
}

function staleBannerHTML() {
  const c = staleWeek();
  if (!c) return "";
  const d = dataWeek();
  return `<div class="banner" role="status" style="margin-bottom:14px"><div>
    <b>Week ${d} is over — it's Week ${c} now.</b> Everything here was built for
    Week ${d}: projections, matchups and lineups are last week's, not this
    week's. ${staleRemedy(c)}</div></div>`;
}

/* ---------------------------------------------------------- 0. the matchup
   Everything here is driven by one simulation. The score, the win probability
   and the path to victory are three views of the same ten thousand seasons,
   which is why they can never disagree with each other. */

/** Where a player's game is right now. Time alone is not enough: without live
    scoring, a game the clock says is over has no points attached, and treating
    that as "finished with zero" would be a lie. So absent a live feed every
    game is reported as pre-kickoff and the card says so. */
function gameState(p) {
  const wk = String(S.meta.upcoming_week);
  const k = S.sched && S.kick && S.kick[wk] && S.kick[wk][p.team];
  if (!k || !S.livePoints) return { phase: "pre", left: 1 };
  const now = Date.now();
  const start = Date.parse(k.kick), end = Date.parse(k.end);
  if (!(start && end) || now < start) return { phase: "pre", left: 1 };
  if (now >= end) return { phase: "final", left: 0 };
  return { phase: "live", left: Math.max(0, Math.min(1, (end - now) / (end - start))) };
}

/** Points already banked this week, when a live feed is attached. */
const banked = p => (S.livePoints && S.livePoints[p.id] != null)
  ? S.livePoints[p.id] : 0;

/** Weekly standard deviation for a projected total, from the measured model. */
function sigmaFor(p, mean) {
  const m = (S.meta.variance && S.meta.variance.by_pos) || {};
  const v = m[p.pos] || m.WR || { intercept: 2, slope: 0.4, floor: 1.5 };
  return Math.max(v.floor || 1.5, v.intercept + v.slope * Math.max(0, mean));
}

/** One side of the matchup, resolved into what is banked and what is still live. */
function sideState(starters) {
  return starters.map(id => S.byId.get(id)).filter(Boolean).map(p => {
    const g = gameState(p);
    const proj = pj(p) || 0;
    const got = banked(p);
    const remainMean = g.phase === "final" ? 0 : proj * g.left;
    return {
      p, phase: g.phase, left: g.left, proj, got,
      remainMean,
      // variance shrinks with the share of the game still to play
      sd: g.phase === "final" ? 0 : sigmaFor(p, proj) * Math.sqrt(g.left),
      expected: got + remainMean,
    };
  });
}

/* A seeded generator, so re-rendering the same matchup gives the same answer.
   The uncertainty being shown is in the model, not in how many dice were
   rolled; a win probability that twitched on every repaint would be claiming
   precision the sample size doesn't have. */
let _rng = mulberry32(1);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Box–Muller, reused rather than recomputed per draw. */
let _spare = null;
function gauss() {
  if (_spare !== null) { const v = _spare; _spare = null; return v; }
  let u = 0, v = 0, s = 0;
  do { u = _rng() * 2 - 1; v = _rng() * 2 - 1; s = u * u + v * v; }
  while (s === 0 || s >= 1);
  const f = Math.sqrt(-2 * Math.log(s) / s);
  _spare = v * f;
  return u * f;
}

/**
 * Simulate the rest of the matchup.
 * Returns the win probability, the margin distribution, and — the useful part —
 * what each of your players averages IN THE WORLDS WHERE YOU WIN. That
 * conditional expectation is the path to victory: not "he could go off", but
 * "across the wins, he goes for about this".
 */
function simulate(mine, theirs, n) {
  n = n || 20000;
  // seed from the state being simulated: same matchup, same answer; a score
  // change or a lineup change moves it
  let seed = 2166136261;
  for (const s of mine.concat(theirs))
    seed = Math.imul(seed ^ Math.round((s.got * 97 + s.remainMean * 13) * 100), 16777619);
  _rng = mulberry32(seed >>> 0);
  _spare = null;
  const margins = new Float64Array(n);
  const condSum = new Float64Array(mine.length);
  const allSum = new Float64Array(mine.length);
  let wins = 0;
  for (let i = 0; i < n; i++) {
    let a = 0, b = 0;
    const draw = new Float64Array(mine.length);
    for (let j = 0; j < mine.length; j++) {
      const s = mine[j];
      const v = s.got + Math.max(0, s.remainMean + s.sd * gauss());
      draw[j] = v; allSum[j] += v; a += v;
    }
    for (const s of theirs) b += s.got + Math.max(0, s.remainMean + s.sd * gauss());
    margins[i] = a - b;
    if (a > b) {
      wins++;
      for (let j = 0; j < mine.length; j++) condSum[j] += draw[j];
    }
  }
  return {
    n, wins, winProb: wins / n, margins,
    condMean: mine.map((_, j) => wins ? condSum[j] / wins : null),
    allMean: mine.map((_, j) => allSum[j] / n),
  };
}

/** Margin distribution. One series, zero marked, the winning half filled. */
function marginChart(margins) {
  const arr = Array.from(margins).sort((a, b) => a - b);
  const lo = arr[Math.floor(arr.length * 0.01)], hi = arr[Math.floor(arr.length * 0.99)];
  const BINS = 34, span = (hi - lo) || 1, w = span / BINS;
  const counts = new Array(BINS).fill(0);
  for (const v of arr) {
    if (v < lo || v > hi) continue;
    counts[Math.min(BINS - 1, Math.floor((v - lo) / w))]++;
  }
  const peak = Math.max(...counts, 1);
  const W = 100, H = 40;
  const zeroX = Math.max(0, Math.min(W, (0 - lo) / span * W));
  return `<svg viewBox="0 0 ${W} ${H + 11}" width="100%" height="104" role="img"
      aria-label="Distribution of your winning margin across simulations"
      style="display:block">
    ${counts.map((c, i) => {
      const x = i / BINS * W, bw = W / BINS, h = c / peak * (H - 2);
      const mid = lo + (i + 0.5) * w;
      return `<rect x="${x + bw * 0.08}" y="${H - h}" width="${bw * 0.84}" height="${h}"
        rx="0.8" fill="${mid >= 0 ? "var(--brand)" : "var(--sunk)"}"></rect>`;
    }).join("")}
    <line x1="${zeroX}" x2="${zeroX}" y1="0" y2="${H}" stroke="var(--ink2)"
      stroke-width="0.8" stroke-dasharray="2 1.6"></line>
    <text x="${zeroX}" y="${H + 9}" text-anchor="middle" font-size="4.6"
      fill="var(--ink2)">tie</text>
    ${zeroX > 14 ? `<text x="2" y="${H + 9}" font-size="4.6"
      fill="var(--muted)">${fmt(lo, 0)}</text>` : ""}
    ${zeroX < W - 14 ? `<text x="${W - 2}" y="${H + 9}" text-anchor="end" font-size="4.6"
      fill="var(--muted)">+${fmt(hi, 0)}</text>` : ""}
  </svg>`;
}

function mRow(s, showLive) {
  const cls = s.phase === "live" ? "live" : s.phase === "final" ? "fin" : "pre";
  const label = s.phase === "live" ? "live" : s.phase === "final" ? "final" : "—";
  return `<div class="mrow" data-player="${esc(s.p.id)}" tabindex="0">
    <span class="pos ${s.p.pos}">${s.p.pos}</span>
    <div style="min-width:0">
      <div style="font-weight:600; overflow-wrap:anywhere">${esc(s.p.name)}</div>
      <div class="pmeta mono">${esc(s.p.team)} ${oppTxt(s.p)}
        <span class="st ${cls}">${label}</span></div>
    </div>
    <div class="n">${showLive ? fmt(s.got) : ""}</div>
    <div class="n" style="color:var(--muted)">${fmt(s.proj)}</div>
  </div>`;
}

function renderMatchup() {
  const lg = S.league;
  if (!hasRosters(lg)) { $("#p-matchup").innerHTML = noRosters("The live matchup"); return; }

  // A finished week's matchup is not this week's matchup. Rather than present
  // last week's game, scores and odds as current, say plainly what is missing.
  const stale = staleWeek();
  if (stale) {
    $("#p-matchup").innerHTML = `
      <div class="card pad stack">
        <div><span class="eyebrow">${esc(lg.platform)} · ${esc(lg.name)}</span>
          <div class="h-sec">Week ${dataWeek()} is over</div></div>
        <div class="sub">This copy doesn't have Week ${stale}'s matchups or projections
          yet, so instead of showing you last week's game as if it were this one, it
          shows nothing. ${staleRemedy(stale)}</div>
      </div>${sourceCard()}`;
    return;
  }
  const wk = String(S.meta.upcoming_week);
  const mu = lg.matchups && lg.matchups[wk];
  const meRoster = me();

  // Pairings come from the platform where we can read them. ESPN's schedule
  // sits behind the same payload that truncates, so some weeks arrive and some
  // don't; where one doesn't, the viewer names the opponent instead and the tab
  // works from that rather than refusing.
  const paired = mu && mu.by_roster && mu.by_roster[meRoster.id];
  // A hand-picked opponent is only good for the week it was picked in. It used
  // to carry over, so a Week 3 pick was presented as the Week 4 opponent.
  const oppId = paired
    ? (mu.pairs.find(x => x.rosters.includes(meRoster.id)) || { rosters: [] })
        .rosters.find(r => r !== meRoster.id)
    : (Number(lg.manual_opponent_week) === Number(wk) ? lg.manual_opponent : null);
  const oppRoster = lg.rosters.find(r => r.id === oppId);

  if (!oppRoster) {
    $("#p-matchup").innerHTML = `
      <div class="card pad stack">
        <div><span class="eyebrow">${esc(lg.platform)} · ${esc(lg.name)}</span>
          <div class="h-sec">Who are you playing in Week ${wk}?</div></div>
        <div class="sub">This league's pairings can't be read automatically. Pick your
          Week ${wk} opponent and it sticks for the week — next week asks again.</div>
        <select id="oppPick" aria-label="Week ${wk} opponent">
          <option value="">Choose a team…</option>
          ${lg.rosters.filter(r => r.id !== meRoster.id)
            .map(r => `<option value="${esc(r.id)}">${esc(r.name)} (${r.wins}-${r.losses})</option>`)
            .join("")}
        </select>
      </div>${sourceCard()}`;
    const sel = $("#oppPick");
    if (sel) sel.addEventListener("change", e => {
      if (!e.target.value) return;
      lg.manual_opponent = e.target.value;
      lg.manual_opponent_week = Number(wk);
      lg.manual = true;
      saveManual(manualMap());
      renderMatchup();
    });
    return;
  }

  /* A pairing can be known while the lineup behind it is not: ESPN gives up
     who plays whom long before it will give up who is starting. So a side
     always falls back to the best lineup its roster can field rather than
     rendering an empty team. */
  const best = r => (r && r.players && r.players.length)
    ? optimalLineup(r.players, lg).lineup.filter(Boolean).map(p => p.id) : [];
  const listed = (entry, roster) =>
    (entry && Array.isArray(entry.starters) && entry.starters.length)
      ? entry.starters : best(roster);

  const myStarters = listed(paired ? mu.by_roster[meRoster.id] : null, meRoster);
  const oppEntry = paired && oppId ? mu.by_roster[oppId] : null;
  const oppStarters = listed(oppEntry, oppRoster);

  const mine = sideState(myStarters);
  const theirs = sideState(oppStarters);

  /* If their roster is unknown, their week is still not a mystery: their season
     scoring average is a real estimate, and the spread of your own lineup is a
     fair stand-in for how much a team in this league moves week to week. Said
     plainly on the card rather than dressed up as a player-level projection. */
  let oppFromAverage = null;
  if (!theirs.length) {
    const games = Math.max(1, (oppRoster.wins || 0) + (oppRoster.losses || 0));
    const mean = (oppRoster.pf || 0) / games;
    if (mean > 0) {
      const varMine = mine.reduce((a, s) => a + s.sd * s.sd, 0);
      oppFromAverage = { mean, sd: Math.max(12, Math.sqrt(varMine)), games };
      theirs.push({ p: { id: "__opp", name: oppRoster.name, pos: "QB", team: "" },
        phase: "pre", left: 1, proj: mean, got: 0,
        remainMean: mean, sd: oppFromAverage.sd, expected: mean, synthetic: true });
    }
  }
  const sim = simulate(mine, theirs, 20000);

  /* Sum what we matched, but SHOW what the platform says. A starter the player
     database doesn't recognise contributes nothing to our sum, which would
     quietly understate the score against the number he can see in the ESPN or
     Sleeper app — and a score that disagrees with the source is worse than no
     score. Where the two differ materially the card says so rather than
     papering over it. */
  const booked = rid => {
    // Whichever route delivered this week's points also delivered the team
    // totals that go with them; prefer those over the shipped snapshot's.
    if (S.liveTotals && typeof S.liveTotals[rid] === "number" && S.liveTotals[rid] > 0)
      return S.liveTotals[rid];
    const e = mu && mu.by_roster && mu.by_roster[rid];
    return (e && typeof e.points === "number" && e.points > 0) ? e.points : null;
  };
  const myMatched = mine.reduce((a, s) => a + s.got, 0);
  const oppMatched = theirs.reduce((a, s) => a + s.got, 0);
  const myBook = S.livePoints ? booked(meRoster.id) : null;
  const oppBook = S.livePoints && oppId ? booked(oppId) : null;
  const myGot = myBook != null ? myBook : myMatched;
  const oppGot = oppBook != null ? oppBook : oppMatched;
  const unmatched = (myBook != null && Math.abs(myBook - myMatched) > 1)
    ? Math.round((myBook - myMatched) * 10) / 10 : 0;
  const myExp = mine.reduce((a, s) => a + s.expected, 0);
  const oppExp = theirs.reduce((a, s) => a + s.expected, 0);
  const anyLive = mine.concat(theirs).some(s => s.phase !== "pre");
  const left = mine.filter(s => s.phase !== "final").length;
  const oppLeft = theirs.filter(s => s.phase !== "final").length;
  const wp = Math.round(sim.winProb * 100);

  // The levers: your players whose winning-world average most exceeds their
  // ordinary projection. Sorted by how much of the gap each one carries.
  const levers = mine.map((s, j) => ({
    s, cond: sim.condMean[j], base: sim.allMean[j],
    lift: (sim.condMean[j] ?? 0) - sim.allMean[j],
  })).filter(x => x.s.phase !== "final" && x.lift > 0.2)
     .sort((a, b) => b.lift - a.lift).slice(0, 5);

  const gap = oppExp - myExp;

  $("#p-matchup").innerHTML = `
    ${rosterSourceBanner()}
    <div class="card pad stack">
      <div class="row" style="justify-content:space-between">
        <span class="eyebrow">Week ${wk} · ${esc(lg.name)}</span>
        <span class="chip ${anyLive ? "good" : ""}">${
          anyLive ? (left + oppLeft > 0 ? "in progress" : "final") : "before kickoff"}</span>
      </div>
      <div class="score">
        <div class="side">
          <div class="nm2">${esc(meRoster.name)}</div>
          <div class="pts">${fmt(anyLive ? myGot : myExp)}</div>
          <div class="sub">${anyLive ? `proj ${fmt(myExp)} · ${left} to play`
            : `${meRoster.wins}-${meRoster.losses}`}</div>
        </div>
        <div class="vs">VS</div>
        <div class="side" style="text-align:right">
          <div class="nm2">${esc(oppRoster.name)}</div>
          <div class="pts">${fmt(anyLive ? oppGot : oppExp)}</div>
          <div class="sub">${anyLive ? `proj ${fmt(oppExp)} · ${oppLeft} to play`
            : `${oppRoster.wins}-${oppRoster.losses}`}</div>
        </div>
      </div>
      ${liveStatus()}
      ${unmatched ? `<div class="sub"><span class="chip warn">note</span>
        ${fmt(unmatched)} of your points come from a starter this app doesn't
        recognise, so the rows below won't add up to the score above.</div>` : ""}
    </div>

    <div class="card pad stack">
      <div><span class="eyebrow">Odds of winning</span>
        <div class="wp"><b style="color:${wp >= 55 ? "var(--good)"
          : wp <= 45 ? "var(--bad)" : "var(--ink)"}">${wp}%</b>
          <span class="sub">${wp >= 65 ? "you're favoured" : wp <= 35 ? "you're the underdog"
            : "close to a coin flip"}</span></div></div>
      <div class="wpbar"><i style="width:${Math.max(0, Math.min(100, wp))}%"></i></div>
      ${marginChart(sim.margins)}
      <div class="srcline">${sim.n.toLocaleString()} simulations, rounded to a whole
        percent — the sample supports about that much precision and no more. Each player is drawn
        around his projection using the weekly variation actually measured this season
        — quarterbacks move least, tight ends most${
        anyLive ? ", and a player's spread shrinks as his game runs down" : ""}.
        ${gap > 0 ? `You project <b>${fmt(gap)}</b> behind.`
          : `You project <b>${fmt(-gap)}</b> ahead.`}
        ${oppFromAverage ? ` Their side is their season average rather than a lineup —
          add their roster for a player-level read.` : ""}</div>
    </div>

    <div class="card pad stack">
      <div><span class="eyebrow">Path to victory</span>
        <div class="h-sec">${
          left === 0 && oppLeft === 0 ? "How it finished"
          : sim.wins === 0 ? "No path left"
          : sim.wins === sim.n ? "It's yours"
          : wp >= 50 ? "What keeps you ahead" : "What has to happen"}</div></div>
      ${(() => {
        const running = left > 0;
        const deficit = oppExp - myExp;
        // Nothing left to play: the week is decided either way.
        if (!running && !oppLeft) return `<div class="note">${myGot > oppGot
          ? `Final — you won by ${fmt(myGot - oppGot)}.`
          : myGot < oppGot ? `Final — you lost by ${fmt(oppGot - myGot)}.`
          : "Final — a tie."}</div>`;
        // Won or lost in every simulation: say so rather than inventing a lever.
        if (sim.wins === 0) return `<div class="note">Not one of the
          ${sim.n.toLocaleString()} simulations ends with you ahead. You are
          <b>${fmt(oppGot - myGot)}</b> down with ${running ? left : "no"} starter${
          left === 1 ? "" : "s"} left, and the most they have ever produced together
          in these runs still falls short. This one is gone.</div>`;
        if (sim.wins === sim.n) return `<div class="note">You win in all
          ${sim.n.toLocaleString()} simulations. ${oppLeft
            ? `They have ${oppLeft} still to play, but not enough left to catch
               ${fmt(myGot - oppGot)}.`
            : "Their week is over."}</div>`;
        if (!levers.length) return `<div class="note">The wins don't hinge on any one
          player — you are ${deficit > 0 ? fmt(deficit) + " behind" : fmt(-deficit)
          + " ahead"} on projection and it comes down to the spread.</div>`;
        return `
          <div class="sub">Across the ${sim.wins.toLocaleString()} simulations you win,
            these are the players who come in above their ordinary projection — and by
            how much. This is the shape of a realistic win, not a best case.</div>
          ${levers.map(x => `<div class="lever">
            <div><div class="pname">${nameCell(x.s.p)}</div>
              <div class="pmeta mono">${esc(x.s.p.team)} ${oppTxt(x.s.p)}${
                x.s.phase === "live" ? " · " + fmt(x.s.got) + " so far" : ""}</div></div>
            <div style="text-align:right">
              <div class="mono" style="font-weight:600">${fmt(x.cond)}</div>
              <div class="pmeta">vs ${fmt(x.base)} normally
                <span style="color:var(--good)">+${fmt(x.lift)}</span></div></div>
          </div>`).join("")}
          <div class="note">${pathNote(wp, gap, levers, left)}</div>`;
      })()}
    </div>

    <div class="card">
      <div class="pad" style="border-bottom:1px solid var(--line)">
        <div class="row" style="justify-content:space-between">
          <span class="eyebrow">${esc(meRoster.name)}</span>
          <span class="sub">${anyLive ? "live · proj" : "projected"}</span></div>
      </div>
      ${mine.map(s => mRow(s, anyLive)).join("")}
      <div class="pad" style="background:var(--card2); border-top:1px solid var(--line);
        border-bottom:1px solid var(--line)">
        <span class="eyebrow">${esc(oppRoster.name)}</span>
      </div>
      ${oppFromAverage ? `<div class="pad stack" style="gap:7px">
        <div class="sub">Their roster isn't loaded, so their week is estimated from
          what they have actually scored: <b>${fmt(oppFromAverage.mean)}</b> per game
          across ${oppFromAverage.games}, give or take ${fmt(oppFromAverage.sd, 0)}.</div>
        <button class="btn ghost sm" data-roster="${esc(oppRoster.id)}">Add their roster</button>
      </div>` : theirs.map(s => mRow(s, anyLive)).join("")}
    </div>

    ${sourceCard()}`;
}

/** One sentence of plain English about what the numbers are saying. */
function pathNote(wp, gap, levers, left) {
  const top = levers[0];
  if (!top) return "";
  const who = top.s.p.name;
  if (wp >= 65)
    return `You don't need anything unusual — hold serve and it's yours. The one
      thing that would put it out of reach is ${esc(who)} clearing
      ${fmt(top.cond)}.`;
  if (wp >= 45)
    return `This comes down to ${esc(who)}. In the wins he averages
      ${fmt(top.cond)} rather than his usual ${fmt(top.base)} — about
      ${fmt(top.lift)} more. With ${left} of your starters still to play, one
      above-average afternoon is enough.`;
  return `You need more than one thing to land. ${esc(who)} at ${fmt(top.cond)} is
    the biggest single swing, but the wins also need ${
      levers[1] ? esc(levers[1].s.p.name) + " near " + fmt(levers[1].cond) : "help elsewhere"}.
    That is a realistic afternoon, not a miracle — it just has to happen twice.`;
}

/* ------------------------------------------------------------- 1. the week */
function renderWeek() {
  const lg = S.league, wk = S.meta.upcoming_week;
  if (!hasRosters(lg)) { $("#p-week").innerHTML = noRosters("Start/sit"); return; }
  const r = me();
  const { slots, lineup, total, bench } = optimalLineup(r.players, lg);

  // What Sleeper currently has starting, when we know it.
  const cur = r.starters && r.starters.length
    ? r.starters.map(i => S.byId.get(i) || null) : null;
  const curTotal = cur ? cur.reduce((a, p) => a + (pj(p) || 0), 0) : null;

  const moves = [];
  if (cur) {
    const optIds = new Set(lineup.filter(Boolean).map(p => p.id));
    const curIds = new Set(cur.filter(Boolean).map(p => p.id));
    const benchNow = [...optIds].filter(i => !curIds.has(i)).map(i => S.byId.get(i));
    const sitNow   = [...curIds].filter(i => !optIds.has(i)).map(i => S.byId.get(i));
    benchNow.forEach((inP, i) => { if (sitNow[i]) moves.push([sitNow[i], inP]); });
  }

  const flag = lineup.filter(p => p && (p.inj || !p.opp));
  // Only flag consensus disagreement while the weekly rankings cover this week.
  const wkFresh = S.meta.weekly_covers_week === S.meta.upcoming_week;
  const risky = wkFresh
    ? lineup.filter(p => p && p.wk_sd != null && pj(p) > 4 && p.wk_sd / pj(p) > 0.9)
    : [];

  $("#p-week").innerHTML = `
    ${rosterSourceBanner()}
    <div class="grid g3">
      ${tile("Projected", fmt(total, 1), (() => {
        const sc = scoringOf(lg);
        if (!sc) return "optimal lineup, PPR";
        if (lg.scoring_partial) return `optimal lineup, ${sc.rec} PPR`;
        return `optimal lineup, ${sc.pass_td}pt pass TD`;
      })())}
      ${(() => {
        const known = lg.rosters.filter(r => (r.players || []).length).length;
        return known >= 3
          ? tile("League median", fmt(medianProj(), 1),
                 `${known} of ${lg.teams} rosters known`)
          : tile("League median", "—",
                 `only ${known} roster${known === 1 ? "" : "s"} loaded`);
      })()}
      ${tile("Your record", matchupLine(r), esc(r.name))}
    </div>

    ${moves.length ? `<div class="card pad stack">
      <div><span class="eyebrow">Lineup changes</span>
        <div class="h-sec">${moves.length} move${moves.length > 1 ? "s" : ""} worth
          ${fmt(total - curTotal, 1)} pts</div></div>
      ${moves.map(([out, inn]) => `<div class="move">
        <div><div class="pmeta">Bench</div><div class="pname">${nameCell(out)}</div>
          <div class="pmeta mono">${fmt(pj(out))} · ${oppTxt(out)}</div></div>
        <div class="arrow">→</div>
        <div><div class="pmeta">Start</div><div class="pname">${nameCell(inn)}</div>
          <div class="pmeta mono">${fmt(pj(inn))} · ${oppTxt(inn)}</div></div>
      </div>`).join("")}
    </div>` : cur ? `<div class="card pad"><span class="chip good">✓ Optimal</span>
      <span class="sub"> Your current lineup already maximises projected points.</span></div>` : ""}

    <div class="card">
      <div class="pad" style="border-bottom:1px solid var(--line)">
        <span class="eyebrow">${esc(r.name)} · Week ${wk} lineup</span>
        <div class="h-sec">Optimal start/sit</div>
      </div>
      ${lineup.map((p, i) => slotRow(slots[i], p)).join("")}
      <div class="pad" style="background:var(--card2); border-top:1px solid var(--line)">
        <span class="eyebrow">Bench (${bench.length})</span>
      </div>
      ${bench.sort((a, b) => pj(b) - pj(a)).slice(0, 10)
        .map(p => slotRow("BN", p, true)).join("") || `<div class="empty">No bench players with a projection.</div>`}
    </div>

    ${(flag.length || risky.length) ? `<div class="card pad stack">
      <span class="eyebrow">Check before kickoff</span>
      ${flag.map(p => `<div class="note"><b>${esc(p.name)}</b> — ${
        p.opp ? `listed ${esc(p.inj)}${p.inj_note ? " (" + esc(p.inj_note) + ")" : ""} on the Week ${
          S.meta.sources?.injuries_week} report. Confirm his status before lock.`
              : "no game this week — he is on bye."}</div>`).join("")}
      ${risky.map(p => `<div class="note"><b>${esc(p.name)}</b> — widest ranking spread in your
        lineup (±${fmt(p.wk_sd)}). The experts disagree about him more than anyone else you're
        starting.</div>`).join("")}
    </div>` : ""}

    ${sourceCard()}`;
}

function slotRow(slot, p, bench) {
  if (!p) return `<div class="slot ${bench ? "bench" : ""}">
    <div class="slot-lbl">${esc(slot)}</div>
    <div class="pmeta">empty — no eligible player with a projection</div><div></div></div>`;
  // FantasyPros weekly grades are only shown while they cover the week we're
  // projecting — the source file lags by a week early in the cycle.
  const wkFresh = S.meta.weekly_covers_week === S.meta.upcoming_week;
  const badge = (wkFresh && p.wk_grade) ? `<span class="chip ${
    /^A/.test(p.wk_grade) ? "good" : /^B/.test(p.wk_grade) ? "" : /^C/.test(p.wk_grade) ? "warn" : "bad"
  }">${esc(p.wk_grade)}</span>` : "";
  return `<div class="slot ${bench ? "bench" : ""}" data-player="${esc(p.id)}" tabindex="0">
    <div class="slot-lbl">${esc(slot === "SUPER_FLEX" ? "SFLX" : slot === "DEF" ? "D/ST" : slot)}</div>
    <div><div class="pname">${nameCell(p)}${badge}</div>
      <div class="pmeta mono">${esc(p.team)} ${oppTxt(p)}${
        seasonPPG(p) != null ? ` · ${fmt(seasonPPG(p))} ppg` : ""}${
        (wkFresh && p.wk_pos_rank) ? ` · FP ${esc(p.wk_pos_rank)}` : ""}</div></div>
    <div class="pproj" title="${projExact(p)
      ? "Computed from a projected stat line under this league's scoring"
      : p.pstats
        ? "Sacko Shield model estimate — its stat line is this league's scoring applied to his own per-game rates, not a projection feed"
        : "Sacko Shield model estimate — no stat line for this player"}">${fmt(pj(p))}${
      projExact(p) ? "" : `<span class="est" aria-label="model estimate">~</span>`}</div>
  </div>`;
}

const tile = (lbl, big, sub) => `<div class="tile"><div class="lbl">${esc(lbl)}</div>
  <div class="big">${big}</div><div class="sub">${esc(sub)}</div></div>`;

function medianProj() {
  const v = S.league.rosters.map(r => teamTotal(r.players, S.league)).sort((a, b) => a - b);
  if (!v.length) return 0;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

/** Your record, plus where this week's projection sits in the league. */
function matchupLine(r) {
  const all = S.league.rosters.map(x => teamTotal(x.players, S.league))
                              .sort((a, b) => b - a);
  const mine = teamTotal(r.players, S.league);
  const rank = all.findIndex(v => v <= mine) + 1;
  return `${r.wins}-${r.losses} <span style="font-size:13px; color:var(--muted)">· ${
    rank}${["th","st","nd","rd"][rank % 10 > 3 || (rank > 10 && rank < 14) ? 0 : rank % 10]
    } proj</span>`;
}

/* --------------------------------------------------------------- 2. waivers */
function renderWaiver() {
  const lg = S.league;
  if (!hasRosters(lg)) { renderStreamBoard(); return; }
  const rostered = new Set(lg.rosters.flatMap(r => r.players));
  const r = me();
  const needs = rosterNeeds(r.players, lg);
  const mine = positionStrength(r.players, lg);

  const f = FILT.waiver;
  const ownerOf = new Map();
  lg.rosters.forEach(t => t.players.forEach(i => ownerOf.set(i, t)));

  let pool = S.players.filter(waiverWorthy);
  if (f.avail === "fa") pool = pool.filter(p => !rostered.has(p.id));
  else if (f.avail === "mine") pool = pool.filter(p => (ownerOf.get(p.id) || {}).id === r.id);
  else if (f.avail === "others")
    pool = pool.filter(p => rostered.has(p.id) && (ownerOf.get(p.id) || {}).id !== r.id);
  pool = baseFilter("waiver", pool);
  if (f.needs) pool = pool.filter(p => ["need", "thin"].includes((needs[p.pos] || {}).label));
  if (f.minProj) pool = pool.filter(p => (pj(p) ?? 0) >= f.minProj);

  const poolTotal = pool.length;
  const fa = sortBy(pool.map(p => ({ ...p, ws: waiverScore(p) })), f.sort, f.dir,
    (p, k) => k === "ws" ? p.ws : k === "proj" ? pj(p) : k === "par" ? parOf(p)
      : k === "poe" ? poeOf(p, true) : k === "name" ? p.name : p[k]).slice(0, 80);

  // droppable: your worst assets by dynasty value that aren't starting
  const { lineup } = optimalLineup(r.players, lg);
  const starting = new Set(lineup.filter(Boolean).map(p => p.id));
  const drops = r.players.map(i => S.byId.get(i)).filter(Boolean)
    .filter(p => !starting.has(p.id))
    .sort((a, b) => (val(a) || 0) - (val(b) || 0)).slice(0, 5);

  $("#p-waiver").innerHTML = `
    ${rosterSourceBanner()}
    <div class="card pad stack">
      <div><span class="eyebrow">${esc(r.name)}</span>
        <div class="h-sec">Where your roster actually needs help</div></div>
      <div class="grid g2">
        ${gradedPositions(lg).map(pos => {
          const n = needs[pos], c = n.label === "need" ? "bad" : n.label === "thin" ? "warn"
                  : n.label === "strength" ? "good" : "";
          return `<div class="row" style="justify-content:space-between">
            <div class="row" style="gap:7px"><span class="pos ${pos}">${pos}</span>
              <span class="chip ${c}">${n.label}</span></div>
            <div class="row" style="gap:8px; flex:1; justify-content:flex-end">
              <div class="bar" style="flex:1; max-width:120px"><i style="width:${
                Math.round(n.pct * 100)}%"></i></div>
              <span class="mono sub">${Math.round(n.pct * 100)}%</span></div>
          </div>`;
        }).join("")}
      </div>
      <div class="sub">Percentile against the other ${lg.teams - 1} rosters, on your top
        ${gradedPositions(lg).map(p => `${p} ${POS_DEPTH[p] || 1}`).join(" / ")} at each spot.
        Kickers and defenses are graded on what they project to score, not on
        dynasty value — nobody holds those.</div>
    </div>

    <div class="card">
      <div class="pad stack" style="border-bottom:1px solid var(--line)">
        <div class="row" style="justify-content:space-between">
          <div><span class="eyebrow">${f.avail === "fa" ? "Free agents"
            : f.avail === "mine" ? "Your roster" : f.avail === "others"
            ? "Other teams' rosters" : "Every player"}</span>
            <div class="h-sec">Best available, ranked</div></div>
          <button class="btn sm ghost" data-export="waivers">Export</button>
        </div>
        ${filterBar("waiver", {
          controls: `
            <select data-f="waiver:avail" aria-label="Availability">
              <option value="fa" ${f.avail === "fa" ? "selected" : ""}>Free agents</option>
              <option value="others" ${f.avail === "others" ? "selected" : ""}>On other teams</option>
              <option value="mine" ${f.avail === "mine" ? "selected" : ""}>On my roster</option>
              <option value="all" ${f.avail === "all" ? "selected" : ""}>Everyone</option>
            </select>
            <input type="number" data-f="waiver:minProj" value="${f.minProj || ""}"
              min="0" max="40" step="1" placeholder="Min projection"
              aria-label="Minimum projected points">
            <label class="ftoggle"><input type="checkbox" data-f="waiver:needs"
              ${f.needs ? "checked" : ""}> Fills a need</label>`,
          count: `${poolTotal} player${poolTotal === 1 ? "" : "s"} match${
            poolTotal === 1 ? "es" : ""}${poolTotal > 80 ? " — showing the top 80" : ""}.`
        })}
      </div>
      <div class="pad sub" style="padding-top:0">
        “vs repl” is projected points above the last startable player at that
        position in a ${lg.teams}-team league
        (${["QB","RB","WR","TE"].map(x => `${x} ${fmt(replacement()[x])}`).join(" · ")}).
        It is the only fair way to line a tight end up against a receiver.
      </div>
      <div class="tw"><table id="waiverTable"><thead><tr>
        ${[["name","Player","t"],["ws","Score","n"],[null,"FAAB","t"],
           ["proj","Wk " + S.meta.upcoming_week,"n"],["par","vs repl","n"],
           ["own","Own%","n"],["snap_last","Snap→","n"],["ppg","PPG","n"],
           ["poe","POE/g","n"],["tgt_share","Tgt%","n"],[null,"Fits","t"]].map(([k,l,t]) =>
          k ? `<th class="${t === "n" ? "n" : ""}" data-sort="${k}">${l}${
            f.sort === k ? ` <span class="sortmark">${f.dir === -1 ? "▼" : "▲"}</span>` : ""}</th>`
            : `<th class="${t === "n" ? "n" : ""}">${l}</th>`).join("")}
      </tr></thead><tbody>
      ${fa.map(p => {
        const fit = needs[p.pos];
        return `<tr data-player="${esc(p.id)}" tabindex="0">
          <td class="nm">${nameCell(p)}<div class="pmeta mono">${esc(p.team)} ${oppTxt(p)}</div></td>
          <td class="n"><b>${p.ws}</b></td>
          <td>${esc(faabPct(p.ws, p))}</td>
          <td class="n">${fmt(pj(p))}</td>
          <td class="n" style="color:${(parOf(p) ?? 0) > 0 ? "var(--good)" : "var(--muted)"}">${
            parOf(p) == null ? "—" : ((parOf(p) > 0 ? "+" : "") + fmt(parOf(p)))}</td>
          <td class="n">${p.own != null ? fmt(p.own, 0) : "—"}</td>
          <td class="n">${p.snap_last != null ? fmt(p.snap_last, 0) : "—"}</td>
          <td class="n">${fmt(seasonPPG(p))}</td>
          <td class="n" title="${p.dst_ctx
            ? esc(p.opp + " is implied for " + p.dst_ctx.opp_implied + " points")
            : "Points over expected per game, from his opportunities"}"
            style="color:${poeOf(p, true) == null ? "var(--muted)"
              : poeOf(p, true) > 1 ? "var(--bad)" : poeOf(p, true) < -1 ? "var(--good)"
              : "var(--ink2)"}">${p.dst_ctx ? fmt(p.dst_ctx.opp_implied, 0) + " imp"
              : poeOf(p, true) == null ? "—"
              : (poeOf(p, true) > 0 ? "+" : "") + fmt(poeOf(p, true))}</td>
          <td class="n">${p.tgt_share != null ? fmt(p.tgt_share, 0) : "—"}</td>
          <td>${fit ? `<span class="chip ${fit.label === "need" ? "bad"
            : fit.label === "thin" ? "warn" : ""}">${fit.label}</span>` : ""}</td>
        </tr>`; }).join("")}
      </tbody></table></div>
      ${fa.length ? "" : `<div class="empty">No players match these filters.
        <button class="btn ghost sm" data-fclear="waiver">Clear them</button></div>`}
    </div>

    <div class="card pad stack">
      <div><span class="eyebrow">Roster space</span>
        <div class="h-sec">Cheapest players to move on from</div></div>
      ${drops.map(p => `<div class="row" style="justify-content:space-between">
        <div class="pname">${nameCell(p)}</div>
        <div class="row" style="gap:10px"><span class="sub mono">${
          val(p) ? fmt(val(p), 0) + " " + valueShort() : "no value"}</span>
        <span class="sub mono">${seasonPPG(p) != null ? fmt(seasonPPG(p)) + " ppg" : ""}</span></div>
      </div>`).join("")}
      <div class="sub">Lowest ${valueLabel()} among players not in your optimal
        lineup.${isDynasty(S.league)
          ? " In a dynasty league, check the age column before dropping anyone young."
          : " Nothing here is priced on future seasons — this is a " +
            esc(S.league.type) + " league."}</div>
    </div>

    ${sourceCard()}`;

  wireFilters("waiver", renderWaiver);
}

/* ---------------------------------------------------------------- 3. trades */
function renderTrade() {
  const lg = S.league, sf = isSuperflex(lg);
  if (!hasRosters(lg)) { $("#p-trade").innerHTML = noRosters("The trade calculator"); return; }
  const r = me();
  const needs = rosterNeeds(r.players, lg);
  const sumSide = side => S.trade[side].reduce((a, x) => a + (x.v || 0), 0);
  const a = sumSide("a"), b = sumSide("b"), tot = a + b || 1;
  const diff = a - b, pct = Math.abs(diff) / Math.max(a, b, 1);
  const verdict = pct < 0.06 ? ["even", "Dead even — this is a fair-value swap."]
    : pct < 0.16 ? [(diff > 0 ? "you send more" : "you get more"),
        `Inside the normal negotiating band (${Math.round(pct * 100)}% gap).`]
    : [(diff > 0 ? "you lose value" : "you win value"),
        `${Math.round(pct * 100)}% gap — that is a real difference, not a rounding error.`];

  $("#p-trade").innerHTML = `
    <div class="card pad stack">
      <div class="row" style="justify-content:space-between">
        <div><span class="eyebrow">${esc(lg.type)} · ${
            isDynasty(lg) ? (sf ? "superflex" : "1QB") + " values"
                          : "rest-of-season points"}</span>
          <div class="h-sec">Trade calculator</div></div>
        <div class="row" style="gap:6px">
          <span class="chip acc">${isDynasty(lg)
            ? (sf ? "2QB / SF pricing" : "1QB pricing")
            : "priced on the rest of this season"}</span>
          ${(a || b) ? `<button class="btn ghost sm" id="tradeClear">Clear</button>` : ""}
        </div>
      </div>
      ${S.tradeSeeded ? `<div class="sub">An example deal to show the tool working —
        clear it and build your own.</div>` : ""}
      <div class="grid g2">
        <div><div class="eyebrow" style="margin-bottom:6px">You send</div>
          <div class="trade-side" id="sideA">${sideHTML("a")}</div>
          <div class="row" style="margin-top:8px"><input type="search" id="searchA"
            placeholder="Add a player or pick…" aria-label="Add to your side"></div>
          <div id="resA"></div>
          <div class="row mono" style="margin-top:8px; justify-content:space-between">
            <span class="sub">Total</span><b>${fmt(a, 0)}</b></div>
        </div>
        <div><div class="eyebrow" style="margin-bottom:6px">You get</div>
          <div class="trade-side" id="sideB">${sideHTML("b")}</div>
          <div class="row" style="margin-top:8px"><input type="search" id="searchB"
            placeholder="Add a player or pick…" aria-label="Add to their side"></div>
          <div id="resB"></div>
          <div class="row mono" style="margin-top:8px; justify-content:space-between">
            <span class="sub">Total</span><b>${fmt(b, 0)}</b></div>
        </div>
      </div>

      ${(a || b) ? `
      <hr class="divider">
      <div class="stack" style="gap:9px">
        <div class="scale" role="img" aria-label="Value split">
          <i style="left:0; width:${Math.round(a / tot * 100)}%"></i><u></u></div>
        <div class="row" style="justify-content:space-between">
          <span class="chip ${pct < 0.06 ? "good" : diff > 0 ? "bad" : "good"}">${esc(verdict[0])}</span>
          <span class="mono sub">${fmt(a, 0)} out · ${fmt(b, 0)} in · ${
            diff > 0 ? "−" : "+"}${fmt(Math.abs(diff), 0)}</span>
        </div>
        <div>${esc(verdict[1])}</div>
        ${tradeFitNotes(needs)}
      </div>` : `<div class="empty">Add players to either side to price the deal.</div>`}
    </div>

    ${!isDynasty(lg) ? "" : `
    <div class="card pad stack">
      <div><span class="eyebrow">Reference</span>
        <div class="h-sec">What picks are worth right now</div></div>
      <div class="tw"><table><thead><tr><th>Pick</th><th class="n">Value</th>
        <th>Equivalent player</th></tr></thead><tbody>
        ${S.picks.filter(pk => (+pk.pick.slice(0, 4)) > S.meta.season)
          .sort((x, y) => ((sf ? y.v_sf : y.v_1qb) || 0) - ((sf ? x.v_sf : x.v_1qb) || 0))
          .slice(0, 16).map(pk => {
          const v = sf ? pk.v_sf : pk.v_1qb;
          const near = S.players.filter(x => val(x))
            .sort((x, y) => Math.abs(val(x) - v) - Math.abs(val(y) - v))[0];
          return `<tr><td class="nm">${esc(pk.pick)}</td><td class="n">${fmt(v, 0)}</td>
            <td>${near ? `<span class="pos ${near.pos}">${near.pos}</span> ${esc(near.name)}` : "—"}</td></tr>`;
        }).join("")}
      </tbody></table></div>
    </div>`}

    ${isDynasty(lg) ? "" : `<div class="card pad stack">
      <div><span class="eyebrow">Why no pick values</span>
        <div class="h-sec">This is a ${esc(lg.type)} league</div></div>
      <div class="sub">Rookie picks and dynasty prices don't apply — there is no
        next season to trade into. Players are valued on what they project to
        score between now and Week ${S.meta.last_week || 18}, above a replacement
        starter at their position, under this league's own scoring.</div>
    </div>`}

    ${sourceCard()}`;

  ["A", "B"].forEach(k => {
    const inp = $("#search" + k);
    inp.addEventListener("input", () => tradeSearch(k.toLowerCase(), inp.value));
  });
  $$("[data-rm]").forEach(b => b.addEventListener("click", () => {
    const [side, i] = b.dataset.rm.split(":");
    S.trade[side].splice(+i, 1); S.tradeSeeded = false; renderTrade();
  }));
  $("#tradeClear")?.addEventListener("click", () => {
    S.trade = { a: [], b: [] }; S.tradeSeeded = false; renderTrade();
  });
}

/** Open the calculator on a plausible deal rather than two empty boxes. */
function seedTrade() {
  if (S.trade.a.length || S.trade.b.length) return;
  const mine = me().players.map(i => S.byId.get(i)).filter(p => p && val(p))
                 .sort((x, y) => val(y) - val(x));
  if (mine.length < 3) return;
  const out = mine[1];                       // your second-best asset
  const held = new Set(me().players);
  const want = val(out) * 0.85;
  const target = S.players
    .filter(p => val(p) && !held.has(p.id) && p.pos !== out.pos)
    .sort((x, y) => Math.abs(val(x) - want) - Math.abs(val(y) - want))[0];
  if (!target) return;
  S.trade.a = [{ name: out.name, pos: out.pos, v: val(out) }];
  S.trade.b = [{ name: target.name, pos: target.pos, v: val(target) }];
  S.tradeSeeded = true;
}

function sideHTML(side) {
  const list = S.trade[side];
  if (!list.length) return `<div class="sub" style="padding:14px 4px; text-align:center">nothing yet</div>`;
  return list.map((x, i) => `<div class="tchip">
    <span>${x.pos ? `<span class="pos ${x.pos}">${x.pos}</span> ` : ""}${esc(x.name)}</span>
    <span class="row" style="gap:8px"><b class="mono">${fmt(x.v, 0)}</b>
    <button data-rm="${side}:${i}" aria-label="Remove ${esc(x.name)}">×</button></span>
  </div>`).join("");
}

function tradeSearch(side, q) {
  const box = $("#res" + side.toUpperCase());
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = ""; return; }
  const sf = isSuperflex(S.league);
  const hits = [
    ...S.players.filter(p => val(p) && p.name.toLowerCase().includes(q))
      .sort((x, y) => val(y) - val(x)).slice(0, 6)
      .map(p => ({ name: p.name, pos: p.pos, v: val(p) })),
    ...(isDynasty(S.league)
      ? S.picks.filter(p => p.pick.toLowerCase().includes(q)).slice(0, 4)
          .map(p => ({ name: p.pick, pos: null, v: sf ? p.v_sf : p.v_1qb }))
      : []),
  ];
  box.innerHTML = hits.length ? `<div class="card" style="margin-top:6px">${hits.map((h, i) =>
    `<button class="btn ghost sm" style="display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0"
      data-add="${side}:${i}">${h.pos ? `<span class="pos ${h.pos}">${h.pos}</span> ` : ""}${
      esc(h.name)} <b class="mono" style="float:right">${fmt(h.v, 0)}</b></button>`).join("")}</div>`
    : `<div class="sub" style="padding:6px 2px">no match</div>`;
  $$("[data-add]", box).forEach(b => b.addEventListener("click", () => {
    const [s, i] = b.dataset.add.split(":");
    S.trade[s].push(hits[+i]); renderTrade();
  }));
}

function tradeFitNotes(needs) {
  const out = [];
  for (const side of ["a", "b"]) {
    for (const x of S.trade[side]) {
      if (!x.pos || !needs[x.pos]) continue;
      const n = needs[x.pos];
      if (side === "b" && n.label === "need")
        out.push(`${x.name} lands at your weakest spot (${x.pos}) — worth paying a small premium for.`);
      if (side === "a" && n.label === "need")
        out.push(`You are already short at ${x.pos}; sending ${x.name} makes that worse.`);
      if (side === "a" && n.label === "strength")
        out.push(`${x.pos} is your deepest position — ${x.name} is the right kind of player to sell.`);
    }
  }
  return out.length ? `<div class="stack" style="gap:6px">${
    [...new Set(out)].map(t => `<div class="note">${esc(t)}</div>`).join("")}</div>` : "";
}

/* ---------------------------------------------------------------- 4. league */
function renderLeague() {
  const lg = S.league;
  if (!hasRosters(lg)) { renderStandingsOnly(); return; }
  const rows = lg.rosters.map(r => {
    const st = positionStrength(r.players, lg);
    const dyn = r.players.reduce((a, i) => a + (val(S.byId.get(i)) || 0), 0);
    const young = r.players.map(i => S.byId.get(i)).filter(Boolean)
      .filter(p => (p.age ?? 99) <= 25).reduce((a, p) => a + (val(p) || 0), 0);
    return { ...r, proj: teamTotal(r.players, lg), dyn, young, st };
  });
  const maxDyn = Math.max(...rows.map(r => r.dyn), 1);
  const maxProj = Math.max(...rows.map(r => r.proj), 1);
  // power = this week's ceiling and long-term assets, weighted by league type
  const w = lg.type === "redraft" ? 0.85 : lg.type === "keeper" ? 0.6 : 0.45;
  rows.forEach(r => r.raw = w * (r.proj / maxProj) + (1 - w) * (r.dyn / maxDyn));
  // stretch across the league so the gaps are readable, not all clustered at 90
  const lo = Math.min(...rows.map(r => r.raw)), hi = Math.max(...rows.map(r => r.raw));
  rows.forEach(r => r.power = Math.round(
    hi > lo ? 40 + 60 * (r.raw - lo) / (hi - lo) : 70));
  rows.sort((a, b) => b.power - a.power);

  const posMax = {};
  for (const pos of ["QB", "RB", "WR", "TE"])
    posMax[pos] = Math.max(...rows.map(r => r.st[pos].top), 1);

  $("#p-league").innerHTML = `
    <div class="card">
      <div class="pad row" style="justify-content:space-between; border-bottom:1px solid var(--line)">
        <div><span class="eyebrow">${esc(lg.name)} · ${lg.teams} teams · ${esc(lg.type)}</span>
          <div class="h-sec">Power rankings</div></div>
        <button class="btn sm ghost" data-export="league">Export</button>
      </div>
      <div class="tw"><table><thead><tr>
        <th>#</th><th>Team</th><th class="n">Power</th><th class="n">W-L</th>
        <th class="n">Wk ${S.meta.upcoming_week}</th>
        <th class="n">${isDynasty(lg) ? "Dynasty value" : "ROS pts"}</th>
        ${isDynasty(lg) ? `<th class="n">U25 value</th>` : ""}<th>Best asset</th>
      </tr></thead><tbody>
      ${rows.map((r, i) => `<tr${r.id === S.myTeam
        ? ' style="background:var(--brand-soft)"' : ""}>
        <td class="n">${i + 1}</td>
        <td class="nm">${esc(r.name)}${r.id === S.myTeam
          ? ' <span class="chip acc">you</span>' : ""}</td>
        <td class="n"><b>${r.power}</b></td>
        <td class="n">${r.wins}-${r.losses}</td>
        <td class="n">${fmt(r.proj, 1)}</td>
        <td class="n">${fmt(r.dyn, 0)}</td>
        ${isDynasty(lg) ? `<td class="n">${fmt(r.young, 0)}</td>` : ""}
        <td>${bestAsset(r)}</td>
      </tr>`).join("")}
      </tbody></table></div>
      <div class="pad sub">Power blends this week's projected ceiling with total
        ${valueLabel()}, weighted ${Math.round(w * 100)}/${Math.round((1 - w) * 100)}
        for a ${esc(lg.type)} league. ${isDynasty(lg)
          ? "Nothing here is priced on one week alone."
          : "No dynasty value is used — this league has no future seasons."}</div>
    </div>

    <div class="card">
      <div class="pad" style="border-bottom:1px solid var(--line)">
        <span class="eyebrow">Roster construction</span>
        <div class="h-sec">Positional strength across the league</div></div>
      <div class="tw"><table><thead><tr><th>Team</th>
        ${["QB","RB","WR","TE"].map(p => `<th class="n">${p}</th>`).join("")}
      </tr></thead><tbody>
      ${rows.map(r => `<tr${r.id === S.myTeam ? ' style="background:var(--brand-soft)"' : ""}>
        <td class="nm">${esc(r.name)}</td>
        ${["QB","RB","WR","TE"].map(pos => {
          const share = r.st[pos].top / posMax[pos];
          return `<td class="n"><div class="row" style="justify-content:flex-end; gap:7px">
            <div class="bar" style="width:52px"><i style="width:${Math.round(share * 100)}%"></i></div>
            <span style="width:34px">${fmt(r.st[pos].top / 1000, 1)}k</span></div></td>`;
        }).join("")}
      </tr>`).join("")}
      </tbody></table></div>
    </div>

    ${sourceCard()}`;
}

/**
 * A waiver board for a league whose rosters we can't read.
 *
 * Ranking a defense or a kicker for streaming doesn't need anyone's roster —
 * it needs this week's matchup and this league's scoring, both of which are in
 * hand. What's missing is who is actually free, so ownership across all leagues
 * stands in for it and the card says that is what it is. This is most of the
 * value of a waiver board for exactly the two positions people stream.
 */
function renderStreamBoard() {
  const lg = S.league;
  const f = FILT.waiver;
  const graded = gradedPositions(lg);
  const streamers = graded.filter(p => p === "DST" || p === "K");
  const pos = f.pos.length ? f.pos : (streamers.length ? streamers : graded);

  let pool = baseFilter("waiver", S.players.filter(p => pj(p) != null))
    .filter(p => pos.includes(p.pos));
  const total = pool.length;

  // Grouped by position, not pooled into one ranking. Kickers outscore defenses
  // on raw points, so a single sorted list buries all 32 defenses below all 32
  // kickers — which is the opposite of useful when the whole point is choosing
  // one of each. Defenses lead because they are the harder call.
  const ORDER = ["DST", "K", "QB", "RB", "WR", "TE"];
  const groups = ORDER.filter(x => pos.includes(x))
    .map(x => ({ pos: x, list: pool.filter(p => p.pos === x)
        .sort((a, b) => (pj(b) || 0) - (pj(a) || 0)) }))
    .filter(g => g.list.length);
  const perGroup = groups.length > 2 ? 15 : 32;

  $("#p-waiver").innerHTML = `
    <div class="card pad stack">
      <div><span class="eyebrow">${esc(lg.platform)} · ${esc(lg.name)}</span>
        <div class="h-sec">Streaming board</div></div>
      <div class="note">${esc(lg.note || "This league's rosters aren't loaded.")}</div>
      <div class="sub">So this can't tell you who is free in your league. It ranks
        every ${streamers.length ? streamers.join(" and ") : "player"} by what they
        project to score <b>under this league's scoring</b>, with how widely each is
        rostered across all leagues as a stand-in for availability — which is most of
        what a streaming decision needs anyway.</div>
      ${filterBar("waiver", {
        controls: "",
        count: `${total} ranked across ${groups.length} position${
                groups.length === 1 ? "" : "s"}.`
      })}
    </div>

    ${groups.map(g => `<div class="card">
      <div class="pad" style="border-bottom:1px solid var(--line)">
        <span class="eyebrow">${g.list.length} ranked</span>
        <div class="h-sec">${g.pos === "DST" ? "Defenses" : g.pos === "K" ? "Kickers"
          : g.pos + "s"} this week</div>
        ${g.pos === "DST" ? `<div class="sub">Ordered by what they project under this
          league's own points-allowed tiers. The implied total is what the betting
          market expects their opponent to score — the biggest single input.</div>` : ""}
      </div>
      <div class="tw"><table><thead><tr>
        <th>Player</th><th class="n">Wk ${S.meta.upcoming_week}</th>
        <th>${g.pos === "DST" ? "Opponent" : "Matchup"}</th>
        <th class="n">Own%</th><th class="n">PPG</th>
      </tr></thead><tbody>
      ${g.list.slice(0, perGroup).map(p => `<tr data-player="${esc(p.id)}" tabindex="0">
        <td class="nm">${nameCell(p)}</td>
        <td class="n"><b>${fmt(pj(p))}</b></td>
        <td class="sub">${p.dst_ctx
          ? `${esc(p.opp)} implied ${fmt(p.dst_ctx.opp_implied, 0)}`
          : esc(oppTxt(p))}</td>
        <td class="n">${p.own != null ? fmt(p.own, 0) : "—"}</td>
        <td class="n">${fmt(seasonPPG(p))}</td>
      </tr>`).join("")}
      </tbody></table></div>
      ${g.list.length > perGroup
        ? `<div class="pad sub">Showing the top ${perGroup} of ${g.list.length}.</div>` : ""}
    </div>`).join("")}
    ${groups.length ? "" : `<div class="card"><div class="empty">Nothing matches these
      filters. <button class="btn ghost sm" data-fclear="waiver">Clear them</button></div></div>`}

    <div class="card pad stack">
      <div><span class="eyebrow">To get the full board</span>
        <div class="h-sec">Add your roster</div></div>
      <div class="sub">Paste your roster in — copy it from ESPN in any format — and this
        becomes a real waiver board: what your roster is short of, who to drop, and your
        own defense and kicker shown against the alternatives. It takes about ten
        seconds and it sticks.</div>
      <div class="row">
        <button class="btn sm" data-roster="${esc(lg.my_team || "")}">Add my roster</button>
        ${lg.source === "espn" ? `<button class="btn ghost sm"
          data-espn="${esc(lg.league_id)}">Try loading from ESPN</button>` : ""}
      </div>
    </div>

    ${sourceCard()}`;

  wireFilters("waiver", renderWaiver);
}

/** A league we know the standings for but not the rosters. */
function renderStandingsOnly() {
  const lg = S.league;
  const rows = [...lg.rosters].sort((a, b) =>

function bestAsset(r) {
  const p = r.players.map(i => S.byId.get(i)).filter(Boolean)
    .sort((a, b) => (val(b) || 0) - (val(a) || 0))[0];

/* --------------------------------------------------------------- 5. players */
/* Columns differ by format on purpose: a redraft manager has no use for a
   rookie rank, and a dynasty manager shouldn't price a roster off one season's
   remaining points. */
const COLS_COMMON = [
  ["name", "Player", "t"], ["team", "Tm", "t"],
  ["proj", "Proj", "n"], ["ppg", "PPG", "n"], ["ecr_ros", "ROS", "n"],
];
const COLS_DYNASTY = [
  ["age", "Age", "n"], ["v_sf", "SF val", "n"], ["v_1qb", "1QB val", "n"],
  ["ecr_dyn_sf", "Dyn SF", "n"], ["ecr_rookie", "Rookie", "n"],
];
const COLS_REDRAFT = [
  ["rosval", "ROS pts", "n"], ["rosppg", "ROS/g", "n"],
];
const COLS_TAIL = [
  ["poe", "POE/g", "n"], ["tgt_share", "Tgt%", "n"], ["snap_last", "Snap%", "n"],
  ["own", "Own%", "n"], ["tgt", "Tgt", "n"], ["rec", "Rec", "n"],
  ["recyd", "RecYd", "n"], ["ruyd", "RuYd", "n"], ["payd", "PaYd", "n"],
];
const cols = () => COLS_COMMON
  .concat(isDynasty(S.league) ? COLS_DYNASTY : COLS_REDRAFT)
  .concat(COLS_TAIL);

/** One cell value, by column key. */
function cellOf(p, k) {
  switch (k) {
    case "proj": return pj(p);
    case "ppg": return seasonPPG(p);
    case "poe": return poeOf(p, true);
    case "rosval": return rosValue(p);
    case "rosppg": return rosPPG(p);
    default: return p[k];
  }
}
const ZERO_DP = new Set(["v_sf", "v_1qb", "tgt", "rec", "recyd", "ruyd", "payd",
                         "own", "ecr_ros", "ecr_rookie", "rosval"]);
function filteredPlayers() {
  const f = FILT.players;
  const rostered = new Map();
  S.league.rosters.forEach(r => r.players.forEach(i => rostered.set(i, r.name)));
  const known = hasRosters(S.league);
  let list = S.players.map(p => ({
    ...p, owner: known ? (rostered.get(p.id) || "Free agent") : "—" }));

  list = baseFilter("players", list);
  if (known && f.owner === "fa") list = list.filter(p => p.owner === "Free agent");
  if (known && f.owner === "mine") list = list.filter(p => p.owner === me().name);
  if (known && f.owner === "rostered") list = list.filter(p => p.owner !== "Free agent");
  if (f.maxAge) list = list.filter(p => p.age != null && p.age <= f.maxAge);
  if (f.inj === "healthy") list = list.filter(p => !p.inj);
  else if (f.inj === "hurt") list = list.filter(p => !!p.inj);

  return sortBy(list, f.sort, f.dir, (p, k) => k === "par" ? parOf(p) : cellOf(p, k));
}

  if (typeof XLSX === "undefined") {

    XLSX.utils.book_append_sheet(wb, sheetFrom(filteredPlayers().map(p => ({
      Player: p.name, Pos: p.pos, Team: p.team, Age: p.age, Owner: p.owner,

        ? { "Dynasty SF": p.v_sf, "Dynasty 1QB": p.v_1qb,

        : { "ROS pts over replacement": rosValue(p),

      "Own %": p.own,
      "Target share %": p.tgt_share, "Snap % last": p.snap_last,
      "POE per game": poeOf(p, true), "Expected pts": xfpOf(p), Targets: p.tgt,
      Receptions: p.rec, "Rec yds": p.recyd, "Rec TD": p.rectd, Carries: p.car,

      INT: p.int, Injury: p.inj || "", Bye: p.bye,

  }
  if (kind === "waivers" || kind === "all") {
    const rostered = new Set(lg.rosters.flatMap(r => r.players));
    XLSX.utils.book_append_sheet(wb, sheetFrom(baseFilter("waiver", S.players
      .filter(p => FILT.waiver.avail === "fa" ? !rostered.has(p.id) : true)

      .sort((a, b) => b.ws - a.ws).slice(0, 150).map(p => ({
        Player: p.name, Pos: p.pos, Team: p.team, "Waiver score": p.ws,
        "FAAB guide": faabPct(p.ws, p), "ROS rank": p.ecr_ros,
        [isDynasty(lg) ? "Dynasty value" : "ROS pts over replacement"]: val(p),
        "Own %": p.own,
        "Snap % last": p.snap_last, PPG: seasonPPG(p), "Target share %": p.tgt_share,
        "POE per game": poeOf(p, true),
        [`Wk${S.meta.upcoming_week} proj`]: pj(p), "Over replacement": parOf(p), Age: p.age,
      }))), "Waivers");
  }
  if (kind === "players" || kind === "all") {
    const dst = S.players.filter(p => p.pos === "DST");
    if (dst.length) XLSX.utils.book_append_sheet(wb, sheetFrom(dst
      .sort((a, b) => (pj(b) || 0) - (pj(a) || 0)).map(p => ({
        Defense: p.name, Team: p.team,
        [`Wk${S.meta.upcoming_week} proj`]: pj(p), Opponent: p.opp || "",
        "Opponent implied pts": p.dst_ctx ? p.dst_ctx.opp_implied : null,
        "Game total": p.dst_ctx ? p.dst_ctx.total : null,
        PPG: seasonPPG(p), Games: p.g, "Pts allowed/g": p.pa_pg, Sacks: p.sacks,
        INT: p.ints, "Fumbles rec": p.fumbles_rec, "Def TD": p.def_tds,
        Safeties: p.safeties, "Blocked kicks": p.blocks,
        "ROS rank": p.ecr_ros, "Own %": p.own, Bye: p.bye,
      }))), "Defenses");
  }
  if (kind === "league" || kind === "all") {
    XLSX.utils.book_append_sheet(wb, sheetFrom(lg.rosters.map(r => {
      const st = positionStrength(r.players, lg);
      return {
        Team: r.name, W: r.wins, L: r.losses, PF: r.pf, PA: r.pa,
        [`Wk${S.meta.upcoming_week} proj`]: +teamTotal(r.players, lg).toFixed(1),
        [isDynasty(lg) ? "Dynasty value" : "ROS pts over replacement"]:
          Math.round(r.players.reduce((a, i) => a + (val(S.byId.get(i)) || 0), 0)),
        QB: st.QB.top, RB: st.RB.top, WR: st.WR.top, TE: st.TE.top,
        Players: r.players.length,
      };
    })), "League");
    XLSX.utils.book_append_sheet(wb, sheetFrom(lg.rosters.flatMap(r =>
      r.players.map(i => S.byId.get(i)).filter(Boolean).map(p => ({
        Team: r.name, Player: p.name, Pos: p.pos, NFL: p.team, Age: p.age,
        ...(isDynasty(lg) ? { "Dynasty SF": p.v_sf } : { "ROS pts": rosValue(p) }),
        PPG: seasonPPG(p), [`Wk${S.meta.upcoming_week} proj`]: pj(p),
      })))), "Rosters");

  try {
    await DOWNLOADS.save({ filename: name, data: buf });
    toast("Saved " + name);
  } catch (e) {
    toast(e?.code === "declined" ? "Export cancelled" : "Couldn't save that file.");
  }

/* ---------------------------------------------------------- player detail */

/** Weekly fantasy points. One series, so the heading names it — no legend.
    Values are labelled directly because there are only a handful of weeks, and
    only weeks he actually played appear: a filled zero is not a zero-point game. */
function gameLogChart(p) {
  // kickers and defenses carry per-week stat lines, so their weeks are scored
  // by this league rather than scaled from a PPR total
  const sc = scoringOf(S.league);
  const pts = (p.wstats && sc) ? p.wstats.map(w => scoreLine(w, sc)) : (p.logs || []);
  const wks = p.logw && p.logw.length ? p.logw : pts.map((_, i) => i + 1);
  if (!pts.length) return `<div class="sub">No games played yet this season.</div>`;
  const k = 1 - recRate();
  const perGameRec = (p.pos === "DST" || p.pos === "K") ? 0
    : (p.g ? (p.rec || 0) / p.g : 0);
  // scale the shipped PPR log by how this league's season total compares
  const exactWeeks = !!(p.wstats && sc);
  const shipped = p.pts, restated = seasonPts(p);
  const ratio = exactWeeks ? 1
    : (shipped && restated && Math.abs(shipped) > 1) ? restated / shipped : 1;
  const vals = pts.map(v => ((+v || 0) - k * perGameRec) * ratio);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;

  const hi = Math.max(...vals, avg, 1);
  const lo = Math.min(...vals, 0);                       // negative games exist
  const W = 100, H = 48, padX = 3, top = 9;
  const span = (hi - lo) || 1;
  const y = v => top + (hi - v) / span * (H - top);
  const zero = y(0);
  const slot = (W - padX * 2) / vals.length;
  const bw = Math.min(slot * 0.62, 14);

  return `
    <svg viewBox="0 0 ${W} ${H + 11}" width="100%" height="112" role="img"
         aria-label="Fantasy points by week" style="display:block">
      <line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--line)"
            stroke-width="0.7" stroke-dasharray="2 2"></line>
      ${lo < 0 ? `<line x1="0" x2="${W}" y1="${zero}" y2="${zero}"
            stroke="var(--line)" stroke-width="0.5"></line>` : ""}
      ${vals.map((v, i) => {
        const cx = padX + slot * (i + 0.5), x = cx - bw / 2;
        const yv = y(v), h = Math.max(1.2, Math.abs(yv - zero));
        const yTop = v >= 0 ? yv : zero;
        return `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" rx="1.6"
                  fill="${v < 0 ? "var(--bad)" : v >= avg ? "var(--brand)" : "var(--sunk)"}"
                ><title>Week ${wks[i]}: ${v.toFixed(1)} points${
                  (p.pa_log && p.pa_log[i] != null)
                    ? ` · allowed ${p.pa_log[i]}` : ""}</title></rect>
          <text x="${cx}" y="${v >= 0 ? Math.max(6, yv - 2.4) : yTop + h + 5}"
                text-anchor="middle" font-size="5.2" fill="var(--ink2)"
                font-family="IBM Plex Mono, monospace">${v.toFixed(0)}</text>
          <text x="${cx}" y="${H + 9}" text-anchor="middle" font-size="4.8"
                fill="var(--muted)">W${wks[i]}</text>`;
      }).join("")}
    </svg>
    <div class="sub">Dashed line is his ${fmt(avg)}-point average${
      vals.length < 4 ? `, off ${vals.length} game${vals.length === 1 ? "" : "s"} —
      too few to lean on` : ""}.${
      wks.length && wks[wks.length - 1] < S.meta.completed_week
        ? ` No stat line since Week ${wks[wks.length - 1]}.` : ""}</div>`;
}

/** Actual against what his opportunities were worth. Two bars, labelled. */
function poeChart(p) {
  const a = actualOf(p), x = xfpOf(p);
  if (a == null || x == null || !p.g) return "";
  const ag = a / p.g, xg = x / p.g, hi = Math.max(ag, xg, 1);
  const bar = (label, v, color) => `
    <div class="row" style="gap:8px; align-items:center">
      <span class="sub" style="width:62px; flex:none">${label}</span>
      <div class="bar" style="flex:1; height:10px"><i style="width:${
        Math.round(v / hi * 100)}%; background:${color}"></i></div>
      <b class="mono" style="width:42px; text-align:right">${fmt(v)}</b>
    </div>`;
  const d = ag - xg;
  return `
    <div class="stack" style="gap:6px">
      ${bar("Actual", ag, "var(--brand)")}
      ${bar("Expected", xg, "var(--muted)")}
      <div class="note">${d >= 0
        ? `Scoring <b>${fmt(d)}</b> more per game than his carries and targets are
           worth at league-average efficiency. Good luck, a good offence, or both —
           but it is the part most likely to fade.`
        : `Scoring <b>${fmt(-d)}</b> <em>less</em> per game than his opportunities are
           worth. The volume is there; the production hasn't followed yet.`}</div>
    </div>`;
}
