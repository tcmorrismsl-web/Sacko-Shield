
<title>Sacko Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --paper:#eef1f0; --card:#ffffff; --card2:#f6f9f8; --sunk:#e4eae8;
  --ink:#11201e; --ink2:#3c514d; --muted:#6b807c; --line:#d6e0dd;
  --brand:#0f3b3a; --brand-soft:#dfeae7; --on-brand:#f4f8f7;
  --accent:#b8860b; --accent-soft:#f7edd2;
  --good:#2f7a5b; --good-soft:#dcefe6; --warn:#a9691a; --warn-soft:#f8ecd9;
  --bad:#a8432f; --bad-soft:#f7e2dd;
  --shadow:0 1px 2px rgba(16,32,30,.06), 0 6px 18px -10px rgba(16,32,30,.22);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b1312; --card:#131e1c; --card2:#182422; --sunk:#0e1817;
    --ink:#e6efec; --ink2:#b6c7c2; --muted:#879a95; --line:#25352f;
    --brand:#5cb8a0; --brand-soft:#16302b; --on-brand:#06110f;
    --accent:#e3b23c; --accent-soft:#2c2412;
    --good:#4fae86; --good-soft:#12271f; --warn:#d09a42; --warn-soft:#2a2113;
    --bad:#d4735c; --bad-soft:#2d1a16;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0b1312; --card:#131e1c; --card2:#182422; --sunk:#0e1817;
  --ink:#e6efec; --ink2:#b6c7c2; --muted:#879a95; --line:#25352f;
  --brand:#5cb8a0; --brand-soft:#16302b; --on-brand:#06110f;
  --accent:#e3b23c; --accent-soft:#2c2412;
  --good:#4fae86; --good-soft:#12271f; --warn:#d09a42; --warn-soft:#2a2113;
  --bad:#d4735c; --bad-soft:#2d1a16;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Archivo, "Helvetica Neue", Arial, sans-serif;
  font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;
}
.mono{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.15}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- shell ---------- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--brand); color:var(--on-brand);
  box-shadow:0 1px 0 rgba(0,0,0,.14);
}
.top-in{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.mark{display:flex; align-items:center; gap:9px; margin-right:auto; min-width:0}
.mark svg{flex:none}
.mark b{font-size:17px; font-weight:800; letter-spacing:-.015em; white-space:nowrap}
.mark span{font-size:11px; opacity:.72; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap}
.topbtn{
  background:rgba(255,255,255,.12); color:inherit; border:1px solid rgba(255,255,255,.2);
  border-radius:99px; padding:5px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.topbtn:hover{background:rgba(255,255,255,.2)}

.tabs{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 48px); z-index:35;
  background:var(--card); border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1180px; margin:0 auto; display:flex; gap:2px; padding:0 10px}
.tab{
  background:none; border:0; border-bottom:2.5px solid transparent; cursor:pointer;
  padding:11px 12px; font-size:13.5px; font-weight:600; color:var(--muted); white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

main{max-width:1180px; margin:0 auto; padding-block:18px 64px; padding-left:16px; padding-right:16px}

/* ---------- primitives ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.grid{display:grid; gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.h-sec{font-size:18px; font-weight:700; letter-spacing:-.01em}
.sub{color:var(--muted); font-size:12.5px}
.divider{height:1px; background:var(--line); border:0; margin:0}

.chip{
  display:inline-flex; align-items:center; gap:5px; border-radius:99px;
  padding:2px 8px; font-size:11px; font-weight:600; background:var(--sunk); color:var(--ink2);
  white-space:nowrap;
}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.chip.acc{background:var(--accent-soft); color:var(--accent)}

.btn{
  background:var(--brand); color:var(--on-brand); border:0; border-radius:8px;
  padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card2); filter:none}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:5px 10px; font-size:12px}

input[type=text],input[type=search],input[type=number],select{
  background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; font-size:13px; min-width:0; width:100%;
}

/* position colouring — encodes role, not decoration */
.pos{font-size:10.5px; font-weight:700; letter-spacing:.03em; border-radius:4px; padding:1px 5px; display:inline-block; min-width:30px; text-align:center}
.pos.QB{background:#e8dcf3; color:#5b2f86}
.pos.RB{background:#d8ecdd; color:#1f6b3d}
.pos.WR{background:#dbe6f6; color:#23507f}
.pos.TE{background:#fae0d4; color:#8f4218}
.pos.K{background:#e6e3dc; color:#5d574a}
.pos.DST{background:#dfe4e9; color:#3e4a55}
:root[data-theme="dark"] .pos.QB,:root:not([data-theme="light"]) .pos.QB{background:#33224a; color:#c9a7ea}
:root[data-theme="dark"] .pos.RB,:root:not([data-theme="light"]) .pos.RB{background:#16371f; color:#7fd39a}
:root[data-theme="dark"] .pos.WR,:root:not([data-theme="light"]) .pos.WR{background:#1a2c44; color:#90bbef}
:root[data-theme="dark"] .pos.TE,:root:not([data-theme="light"]) .pos.TE{background:#3d2314; color:#eba777}
:root[data-theme="dark"] .pos.K,:root:not([data-theme="light"]) .pos.K{background:#2d2a24; color:#bdb5a4}
:root[data-theme="dark"] .pos.DST,:root:not([data-theme="light"]) .pos.DST{background:#232c33; color:#a5b6c3}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .pos.QB{background:#e8dcf3;color:#5b2f86}
  :root:not([data-theme="dark"]) .pos.RB{background:#d8ecdd;color:#1f6b3d}
  :root:not([data-theme="dark"]) .pos.WR{background:#dbe6f6;color:#23507f}
  :root:not([data-theme="dark"]) .pos.TE{background:#fae0d4;color:#8f4218}
  :root:not([data-theme="dark"]) .pos.K{background:#e6e3dc;color:#5d574a}
  :root:not([data-theme="dark"]) .pos.DST{background:#dfe4e9;color:#3e4a55}
}

/* ---------- tables ---------- */
.tw{overflow-x:auto; border-radius:var(--r)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{
  font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  font-weight:700; background:var(--card2); position:sticky; top:0; cursor:pointer; user-select:none;
}
th.n,td.n{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--card2)}
tr[data-player],.slot[data-player]{cursor:pointer}
tr[data-player]:focus-visible,.slot[data-player]:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.slot[data-player]:hover{background:var(--card2)}
td.nm{white-space:normal; min-width:150px; font-weight:600}
.sortmark{opacity:.5; font-size:9px}

/* ---------- lineup rows ---------- */
.slot{display:grid; grid-template-columns:46px 1fr auto; gap:10px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot.bench{background:var(--card2)}
.slot-lbl{font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--muted); text-transform:uppercase}
.pname{font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap; line-height:1.25}
.pmeta{font-size:11.5px; color:var(--muted)}
.pproj{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:15px; text-align:right; font-variant-numeric:tabular-nums}

.move{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; padding:11px 13px; border:1px solid var(--warn); background:var(--warn-soft); border-radius:8px}
.move .arrow{font-size:16px; color:var(--warn); font-weight:700}

/* ---------- bars & sparks ---------- */
.bar{height:7px; border-radius:99px; background:var(--sunk); overflow:hidden; min-width:54px}
.bar>i{display:block; height:100%; background:var(--brand); border-radius:99px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-family:"IBM Plex Mono",monospace; font-weight:600}

.tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px}
.tile .big{font-family:"IBM Plex Mono",monospace; font-size:24px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.tilerow{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.tilerow .tile{padding:9px 10px}
.tilerow .big{font-size:19px}
.tilerow .sub{font-size:10.5px; line-height:1.3}
.tile .lbl{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}

/* ---------- trade ---------- */
.trade-side{background:var(--card2); border:1px dashed var(--line); border-radius:8px; padding:10px; min-height:96px}
.tchip{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:6px 9px; margin-bottom:6px}
.tchip button{background:none; border:0; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 2px}
.scale{height:12px; border-radius:99px; background:var(--sunk); position:relative; overflow:hidden}
.scale>i{position:absolute; top:0; bottom:0; background:var(--brand)}
.scale>u{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); left:50%}

/* ---------- misc ---------- */
.sheet{position:fixed; inset:0; z-index:60; background:rgba(8,18,16,.5); display:flex; align-items:flex-end; justify-content:center}
@media(min-width:620px){.sheet{align-items:center}}
.sheet-in{background:var(--card); border-radius:14px 14px 0 0; width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:620px){.sheet-in{border-radius:14px}}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:70; background:var(--ink); color:var(--paper); padding:9px 15px; border-radius:99px; font-size:13px; font-weight:500; box-shadow:var(--shadow); max-width:88vw}
/* ---------- matchup ---------- */
.score{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.score .side{min-width:0}
.score .nm2{font-weight:700; font-size:13.5px; line-height:1.25; overflow-wrap:anywhere}
.score .pts{font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600;
  letter-spacing:-.02em; line-height:1.05; font-variant-numeric:tabular-nums}
.score .vs{font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.08em}
.wp{display:flex; align-items:baseline; gap:8px}
.wp b{font-family:"IBM Plex Mono",monospace; font-size:34px; font-weight:600; letter-spacing:-.02em}
.wpbar{height:12px; border-radius:99px; background:var(--bad-soft); overflow:hidden; position:relative}
.wpbar>i{display:block; height:100%; background:var(--brand)}
.mrow{display:grid; grid-template-columns:34px 1fr auto auto; gap:8px; align-items:center;
  padding:7px 12px; border-bottom:1px solid var(--line); font-size:13px}
.mrow:last-child{border-bottom:0}
.mrow .st{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase}
.mrow .live{color:var(--good)}
.mrow .fin{color:var(--muted)}
.mrow .pre{color:var(--ink2)}
.mrow .n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; min-width:44px}
.lever{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
  padding:8px 0; border-bottom:1px solid var(--line)}
.lever:last-child{border-bottom:0}
/* ---------- filters ---------- */
.filters{display:flex; flex-direction:column; gap:9px}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.fchip{
  background:var(--card); border:1px solid var(--line); border-radius:99px;
  padding:4px 11px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink2);
}
.fchip:hover{border-color:var(--brand)}
.fchip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:8px}
.fcount{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.ftoggle{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
  border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;
  background:var(--card)}
.ftoggle input{accent-color:var(--brand); margin:0}
.empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:13px}
.srcline{font-size:11px; color:var(--muted); line-height:1.6}
.est{font-size:11px; color:var(--muted); vertical-align:super; margin-left:1px}
.srcline b{font-family:"IBM Plex Mono",monospace; color:var(--ink2); font-weight:500}
a{color:var(--brand)}
.note{border-left:2.5px solid var(--accent); padding:2px 0 2px 11px; font-size:12.5px; color:var(--ink2)}
.banner{background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r); padding:11px 14px; font-size:12.5px; display:flex; gap:10px; align-items:flex-start}
</style>

<header class="top">
  <div class="top-in">
    <div class="mark">
      <svg width="24" height="27" viewBox="0 0 24 27" aria-hidden="true">
        <path d="M12 1 22 4.4v9.1c0 6-4.2 10.4-10 12.4C6.2 23.9 2 19.5 2 13.5V4.4L12 1Z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8.2 13.6 11 16.4l5.2-5.6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <b>Sacko Shield</b><br>
        <span id="leagueLabel">loading league</span>
      </div>
    </div>
    <button class="topbtn" id="btnConnect" type="button">League</button>
    <button class="topbtn" id="btnTheme" type="button" aria-label="Switch theme">Theme</button>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" role="tablist" id="tabbar"></div>
</nav>

<main>
  <div id="staleBanner"></div>
  <section id="p-matchup" role="tabpanel" class="stack"></section>
  <section id="p-week"   role="tabpanel" class="stack" hidden></section>
  <section id="p-waiver" role="tabpanel" class="stack" hidden></section>
  <section id="p-trade"  role="tabpanel" class="stack" hidden></section>
  <section id="p-league" role="tabpanel" class="stack" hidden></section>
  <section id="p-players" role="tabpanel" class="stack" hidden></section>
</main>

<script>
/* ============================================================ Sacko Shield
   A dynasty / redraft / keeper cockpit for Sleeper and ESPN leagues.

   Data: reference data (values, rankings, production, schedule) ships with
   the page as JSON. League data comes from a live Sleeper call when the
   sandbox allows it, otherwise from the copy baked in at publish time.
   ========================================================================= */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const S = {
  players: [], byId: new Map(), sched: {}, dvp: {}, byes: {}, picks: [],
  meta: {}, leagues: [], league: null, live: false, tab: "matchup",
  kick: null, livePoints: null, canPollLive: false, liveAt: null, liveErr: null,
  myTeam: null, trade: { a: [], b: [] }, watch: new Set(),
  /* Live scoring arrives by two independent routes and the fresher one wins.
     `direct*` is this browser's own call to Sleeper or ESPN — instant when the
     page is allowed to make it, which the downloaded copy always is and a
     published artifact is not. `relay` is the same numbers written into the
     artifact's own data store by a scheduled task, which needs no outbound call
     from the page at all. See applyLive(). */
  liveSrc: null, liveTotals: null,
  directPts: null, directTotals: null, directAt: null, directWeek: null,
  relay: null, relayErr: null,
};

/** A league we have rosters for — the tools need them. */
const hasRosters = lg => !!lg && (lg.status === "full" || lg.status === "manual");

function switchLeague(key) {
  const lg = S.leagues.find(l => l.key === key);
  if (!lg) return;
  S.league = lg;
  S.myTeam = lg.my_team || (lg.rosters[0] || {}).id || null;
  S.trade = { a: [], b: [] }; S.tradeSeeded = false;
  // Scores are per league: drop every cached number, from both routes, before
  // the new league's first poll lands — showing one league's points against
  // another's lineup would be worse than showing none.
  S.livePoints = null; S.liveAt = null; S.liveErr = null; S.liveSrc = null;
  S.liveTotals = null; S.directPts = null; S.directTotals = null;
  S.directAt = null; S.directWeek = null; S.relay = null;
  if (typeof startLive === "function") { clearTimeout(_liveTimer);
    subscribeRelay(); pollLive().then(scheduleLive); }
  if (hasRosters(lg)) seedTrade();
  $("#leagueLabel").textContent = `${lg.platform} · ${lg.name}`;
  saveState({ leagueKey: key });
  show(S.tab);
}

/* ------------------------------------------------------- manual rosters
   ESPN's roster payload can't be read from claude.ai at all, and whether a
   browser can read it directly depends on CORS headers this session has no way
   to test. So the app does not depend on that call succeeding: a roster can be
   pasted in, and everything downstream — start/sit, the waiver board, the
   matchup — works from it exactly as it does for Sleeper. */

/* Team nicknames, and ESPN's own pro-team ids. Both are needed to recognise a
   defense: people paste "Vikings", and ESPN calls it "Vikings D/ST" with a
   negative player id, while our database keys it "MIN". */
const TEAM_NICK = {
  ARI: "cardinals", ATL: "falcons", BAL: "ravens", BUF: "bills",
  CAR: "panthers", CHI: "bears", CIN: "bengals", CLE: "browns",
  DAL: "cowboys", DEN: "broncos", DET: "lions", GB: "packers",
  HOU: "texans", IND: "colts", JAX: "jaguars", KC: "chiefs",
  LV: "raiders", LAC: "chargers", LAR: "rams", MIA: "dolphins",
  MIN: "vikings", NE: "patriots", NO: "saints", NYG: "giants",
  NYJ: "jets", PHI: "eagles", PIT: "steelers", SEA: "seahawks",
  SF: "49ers", TB: "buccaneers", TEN: "titans", WAS: "commanders",
};
const ESPN_PRO_TEAM = {
  1: "ATL", 2: "BUF", 3: "CHI", 4: "CIN", 5: "CLE", 6: "DAL", 7: "DEN",
  8: "DET", 9: "GB", 10: "TEN", 11: "IND", 12: "KC", 13: "LV", 14: "LAR",
  15: "MIA", 16: "MIN", 17: "NE", 18: "NO", 19: "NYG", 20: "NYJ", 21: "PHI",
  22: "ARI", 23: "PIT", 24: "LAC", 25: "SF", 26: "SEA", 27: "TB", 28: "WAS",
  29: "CAR", 30: "JAX", 33: "BAL", 34: "HOU",
};

let _nameIndex = null;
/** Every player keyed by the forms someone might paste. */
function nameIndex() {
  if (_nameIndex) return _nameIndex;
  const NICK = TEAM_NICK;
  const idx = [];
  for (const p of S.players) {
    if (p.pos === "DST") {
      const nick = NICK[p.team];
      if (nick) idx.push({ key: nick, p });
      idx.push({ key: nameKey(p.team + " dst"), p });
      idx.push({ key: nameKey(p.team + " d st"), p });
    } else if (p.key && p.key.includes(" ")) {
      idx.push({ key: p.key, p });
    }
  }
  // longest first, so "amon ra st brown" wins over any shorter overlap
  idx.sort((a, b) => b.key.length - a.key.length);
  _nameIndex = idx;
  return idx;
}

/**
 * Pull known players out of whatever someone pasted.
 * ESPN's roster page copies as a jumble of slot labels, names and team
 * abbreviations, and it differs between the app and the site — so rather than
 * parse a format, this scans for names it recognises and keeps them in the
 * order they appear.
 */
function parseRosterText(text) {
  // Collapse every separator to a single space BEFORE normalising. nameKey
  // strips anything that isn't a letter or space, so a raw newline would be
  // deleted rather than separated — gluing "Bench" onto the next name and
  // losing every player that followed a heading.
  const flat = String(text || "").replace(/[\s\/,|\-\u2013\u2014()\[\]]+/g, " ");
  const hay = " " + nameKey(flat) + " ";
  const seen = new Set(), hits = [];
  let masked = hay;
  for (const { key, p } of nameIndex()) {
    if (seen.has(p.id)) continue;
    const at = masked.indexOf(" " + key + " ");
    if (at === -1) continue;
    seen.add(p.id);
    hits.push({ at, p });
    // blank the match so a shorter name can't claim the same characters
    masked = masked.slice(0, at + 1) + "\u0000".repeat(key.length)
           + masked.slice(at + 1 + key.length);
  }
  hits.sort((a, b) => a.at - b.at);
  return hits.map(h => h.p);
}

/**
 * Persisted manual rosters, keyed league → roster id → player ids.
 *
 * A paste used to win unconditionally, which is a trap: once a league had been
 * pasted into, that copy was pinned in browser storage AND in the artifact's
 * own store, and every later data fix was silently discarded on load. A roster
 * pasted before a D/ST could be read kept the D/ST slot empty forever, through
 * repeated fixes that were all working correctly underneath it.
 *
 * So a paste only outranks the shipped rosters when it is NEWER than the data
 * build. An older paste for a league that now ships real rosters is set aside —
 * not deleted, and the banner offers to put it back.
 */
function applyManual(store) {
  const map = (store && store.map) ? store.map : store;   // legacy: a bare map
  if (!map) return;
  const savedAt = (store && store.savedAt) ? Date.parse(store.savedAt) : NaN;
  const built = S.meta && S.meta.built ? Date.parse(S.meta.built) : NaN;
  const fresher = !(built > 0) || (savedAt > 0 && savedAt > built);

  S.manualSetAside = [];
  for (const lg of S.leagues) {
    const forLeague = map[lg.key];
    if (!forLeague) continue;
    // An opponent pick is stamped with its week and only ever used in that week,
    // so it needs no freshness gate — and it is not a roster. Picking one used
    // to save every roster alongside it, which then reloaded as a "paste" and put
    // a banner on screen claiming a roster had been pasted when none had.
    if (forLeague.__opponent) {
      lg.manual_opponent = forLeague.__opponent;
      // a pick saved before picks were week-stamped belongs to no week
      lg.manual_opponent_week = forLeague.__opponentWeek ?? null;
    }
    const pasted = Object.keys(forLeague).filter(k => !k.startsWith("__")
      && Array.isArray(forLeague[k]) && forLeague[k].length);
    if (!pasted.length) continue;
    if (lg.status === "full" && !fresher) {
      // shipped rosters are newer than this paste — keep them
      lg.manual_available = true;
      S.manualSetAside.push(lg.name);
      continue;
    }
    let any = false;
    for (const r of lg.rosters) {
      const ids = forLeague[r.id];
      if (Array.isArray(ids) && ids.length) { r.players = ids; r.starters = []; any = true; }
    }
    if (any) {
      lg.manual_applied = true;
      if (lg.status !== "full") { lg.status = "manual"; lg.manual = true; }
    }
  }
}

/** Put a league back on the rosters it shipped with. */
function useShippedRoster(key) {
  const lg = S.leagues.find(l => l.key === key);
  if (!lg || !lg._shipped) return;
  for (const r of lg.rosters) {
    const ids = lg._shipped[r.id];
    if (ids) { r.players = ids.slice(); r.starters = []; }
  }
  lg.manual = false; lg.manual_applied = false; lg.manual_available = true;
  saveManual(manualMap());
  show(S.tab);
  toast(`${lg.name} is back on the rosters read from ${lg.platform}`);
}

/** Says plainly which roster the tools are working from, and offers the other. */
function rosterSourceBanner() {
  const lg = S.league;
  if (!lg) return "";
  if (lg.manual_applied && lg._shipped)
    return `<div class="banner"><div>Working from the roster you pasted in, not the
      one read from ${esc(lg.platform)}. If something looks missing — a defense or a
      kicker, say — it is missing from the paste.
      <div class="row" style="margin-top:7px">
        <button class="btn sm" data-shipped="${esc(lg.key)}">Use ${esc(lg.platform)}'s roster</button>
        <button class="btn ghost sm" data-roster="${esc(lg.my_team || "")}">Edit the paste</button>
      </div></div></div>`;
  if (lg.manual_available)
    return `<div class="note">Working from rosters read from ${esc(lg.platform)}. A
      roster you pasted in earlier was set aside because this data is newer —
      <button class="btn ghost sm" data-roster="${esc(lg.my_team || "")}">edit it</button>
      to bring it back.</div>`;
  return "";
}

function manualMap() {
  const map = {};
  for (const lg of S.leagues) {
    if (!lg.manual) continue;
    const entry = {};
    for (const r of lg.rosters) {
      if (!r.players || !r.players.length) continue;
      // Only what the viewer actually changed. A roster identical to the one
      // shipped is not a paste, and saving it as one is how picking an opponent
      // used to masquerade as pasting a roster.
      const shipped = lg._shipped && lg._shipped[r.id];
      if (shipped && shipped.length === r.players.length
          && shipped.every((x, i) => x === r.players[i])) continue;
      entry[r.id] = r.players;
    }
    if (lg.manual_opponent) {
      entry.__opponent = lg.manual_opponent;
      entry.__opponentWeek = lg.manual_opponent_week ?? null;
    }
    if (Object.keys(entry).length) map[lg.key] = entry;
  }
  return map;
}

/** In-page retry from the "no rosters" card, without opening the sheet. */
async function loadEspnInline(btn, leagueId) {
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = "Contacting ESPN…";
  try {
    let lgNew = await tryEspn(leagueId, S.meta.season);
    const prior = S.leagues.find(l => l.key === lgNew.key);
    lgNew = mergeLeague(prior, lgNew);
    if (prior && prior.my_team) {
      const oldTeam = prior.rosters.find(r => r.id === prior.my_team);
      const now = lgNew.rosters.find(r => r.id === prior.my_team)
        || lgNew.rosters.find(r => r.name === (oldTeam || {}).name);
      if (now) lgNew.my_team = now.id;
    }
    if (!lgNew.my_team && lgNew.rosters.length) lgNew.my_team = lgNew.rosters[0].id;
    S.leagues = [...S.leagues.filter(l => l.key !== lgNew.key), lgNew];
    saveConnected(lgNew);
    switchLeague(lgNew.key);
    toast(lgNew.status === "full"
      ? `Loaded ${lgNew.rosters.length} rosters from ESPN`
      : "ESPN gave standings but no rosters");
  } catch (err) {
    btn.disabled = false; btn.textContent = was;
    toast(String(err.message || err));
  }
}

/**
 * Carry forward anything a live fetch can't supply.
 *
 * A refresh used to replace the league object wholesale, which quietly took
 * `scoring_settings` with it — so a league paying 6 per passing touchdown
 * reverted to the default 4 with nothing on screen to say so. Losing the
 * head-to-head pairings was the visible half of the same bug.
 */
function mergeLeague(prev, fresh) {
  if (!prev) return fresh;
  const out = Object.assign({}, fresh);
  for (const k of ["scoring_settings", "scoring_partial", "note", "platform",
                   "type", "season"]) {
    if (out[k] == null && prev[k] != null) out[k] = prev[k];
  }
  // Matchups are week-specific: keep the old ones only when they still cover
  // the week being shown, because a stale pairing is worse than none.
  const wk = String(S.meta.upcoming_week);
  if ((!out.matchups || !out.matchups[wk]) && prev.matchups && prev.matchups[wk]) {
    out.matchups = Object.assign({}, out.matchups || {});
    out.matchups[wk] = prev.matchups[wk];
  }
  return out;
}

let DB = null, DOWNLOADS = null, USER_ID = null;

/* ------------------------------------------------------------ league shape */
const SLOTS = {
  QB:["QB"], RB:["RB"], WR:["WR"], TE:["TE"], K:["K"], DEF:["DST"],
  FLEX:["RB","WR","TE"], WRRB_FLEX:["RB","WR"], REC_FLEX:["WR","TE"],
  SUPER_FLEX:["QB","RB","WR","TE"], IDP_FLEX:[], BN:[], TAXI:[], IR:[],
};
const startingSlots = lg => (lg.roster_positions || [])
  .filter(s => !["BN","TAXI","IR"].includes(s));
const isSuperflex = lg => startingSlots(lg).some(s => s === "SUPER_FLEX" || s === "QB_FLEX")
  || startingSlots(lg).filter(s => s === "QB").length > 1;

/* value column the league actually plays under */
const scoringLabel = sc => sc === "half" ? "half PPR"
  : sc === "unknown" ? "scoring unknown" : String(sc).toUpperCase();

/* ------------------------------------------------------- format isolation
   A dynasty value and a redraft value answer different questions. Dynasty asks
   what a player is worth to own for years; redraft asks what he will score
   between now and the end of this season. Mixing them is how a win-now team
   trades away its season for a rookie pick, or a dynasty team sells a
   22-year-old for a rental.

   So a redraft league never sees a dynasty number, and a dynasty league never
   prices an asset off one week's matchup. `val()` returns whichever basis the
   active league is actually playing under. */
const isDynasty = lg => !!lg && (lg.type === "dynasty" || lg.type === "keeper");

/** Weeks left in the regular season for this player, his bye removed. */
function weeksLeft(p) {
  const first = S.meta.upcoming_week || 1;
  const last = S.meta.last_week || 18;
  let n = Math.max(0, last - first + 1);
  if (p && p.bye && p.bye >= first && p.bye <= last) n -= 1;
  return n;
}

/* Rest-of-season consensus rank within a position. League-independent, so it
   is built once. */
let _rosRank = null;
function rosRank(p) {
  if (!_rosRank) {
    _rosRank = new Map();
    for (const pos of ["QB", "RB", "WR", "TE", "K", "DST"]) {
      S.players.filter(x => x.pos === pos && x.ecr_ros != null)
        .sort((a, b) => a.ecr_ros - b.ecr_ros)
        .forEach((x, i) => _rosRank.set(x.id, i + 1));
    }
  }
  return _rosRank.has(p.id) ? _rosRank.get(p.id) : null;
}

/* Points-per-game by positional rank, in THIS league's points. Rebuilt when
   the league changes, because the scoring underneath it changes. */
let _curve = null, _curveKey = null;
function rosCurve() {
  const lg = S.league;
  const key = lg ? lg.key : "none";
  if (_curveKey === key && _curve) return _curve;
  const out = {};
  for (const pos of ["QB", "RB", "WR", "TE", "K", "DST"]) {
    out[pos] = S.players.filter(p => p.pos === pos && pj(p) != null)
      .map(pj).sort((a, b) => b - a);
  }
  _curveKey = key; _curve = out;
  return out;
}

/** What he is expected to average from here, in this league's points. */
function rosPPG(p) {
  if (!p) return null;
  const curve = rosCurve()[p.pos];
  const rank = rosRank(p);
  if (!curve || !curve.length) return pj(p);
  if (rank == null) return pj(p);
  return curve[Math.min(rank, curve.length) - 1];
}

/** The redraft equivalent of a dynasty value: points above replacement over
    the games this player has left. */
function rosValue(p) {
  const ppg = rosPPG(p), repl = replacement()[p.pos];
  if (ppg == null || repl == null) return null;
  return Math.max(0, Math.round((ppg - repl) * weeksLeft(p) * 10) / 10);
}

const val = p => !p ? null
  : isDynasty(S.league)
    ? ((isSuperflex(S.league) ? p.v_sf : p.v_1qb) ?? null)
    : rosValue(p);

const valueLabel = () => isDynasty(S.league)
  ? (isSuperflex(S.league) ? "dynasty value, superflex" : "dynasty value, 1QB")
  : "rest-of-season points over replacement";
const valueShort = () => isDynasty(S.league) ? "value" : "ROS pts";
/* The two bases live on different scales, so anything that normalises a value
   into a 0–1 term needs the right ceiling. */
const valueScale = () => isDynasty(S.league) ? 4000 : 90;

/* ------------------------------------------------------------ scoring
   A projection expressed as points is only true under the scoring that made
   it. Public projections assume 4 per passing touchdown and 0.04 per yard;
   this league pays 6 and 0.05, which is worth five to seven points a week to
   every starting quarterback. So the stored projection is a STAT LINE and the
   points are computed here, against whatever the league actually pays.

   Stat keys use Sleeper's scoring_settings names, so the two multiply directly. */

/* What a league pays when nothing says otherwise. ESPN only surfaces its
   reception value without mSettings, so a partial table has to sit ON TOP of
   these rather than replace them — scoring a stat line against {rec: 0.5}
   alone values a quarterback at zero. */
const DEFAULT_SCORING = {
  pass_yd: 0.04, pass_td: 4, pass_int: -2, pass_2pt: 2,
  rush_yd: 0.1, rush_td: 6, rush_2pt: 2,
  rec: 1, rec_yd: 0.1, rec_td: 6, rec_2pt: 2,
  fum_lost: -2, fum_rec_td: 6,
  sack: 1, int: 2, fum_rec: 2, safe: 2, def_td: 6, blk_kick: 2,
  // kickers: the common default is 3 inside 40, 4 from the forties, 5 beyond
  fgm: 0, fgm_0_19: 3, fgm_20_29: 3, fgm_30_39: 3, fgm_40_49: 4, fgm_50p: 5,
  fgmiss: -1, xpm: 1, xpmiss: -1,
  pts_allow_0: 10, pts_allow_1_6: 7, pts_allow_7_13: 4, pts_allow_14_20: 1,
  pts_allow_21_27: 0, pts_allow_28_34: -1, pts_allow_35p: -4,
};

let _scCache = null, _scKey = null;
function scoringOf(lg) {
  if (!lg) return null;
  const key = lg.key + ":" + (lg.scoring_settings ? "s" : "n");
  if (_scKey === key && _scCache) return _scCache;
  const own = lg.scoring_settings;
  _scCache = own
    ? (lg.scoring_partial ? { ...DEFAULT_SCORING, ...own } : own)
    : { ...DEFAULT_SCORING };
  _scKey = key;
  return _scCache;
}

/** Multiply a stat line by a scoring table. Unknown keys score nothing. */
function scoreLine(stats, sc) {
  if (!stats || !sc) return null;
  let total = 0;
  for (const k in stats) {
    const mult = sc[k];
    if (typeof mult === "number") total += stats[k] * mult;
  }
  return total;
}

/* A defense's points-allowed tier, under this league's own tier values. */
const PA_BANDS = [
  [0, 0, "pts_allow_0"], [1, 6, "pts_allow_1_6"], [7, 13, "pts_allow_7_13"],
  [14, 20, "pts_allow_14_20"], [21, 27, "pts_allow_21_27"],
  [28, 34, "pts_allow_28_34"], [35, 999, "pts_allow_35p"],
];
const paPoints = (pa, sc) => {
  for (const [lo, hi, key] of PA_BANDS)
    if (pa >= lo && pa <= hi) return sc && sc[key] != null ? sc[key] : 0;
  return 0;
};
const erf = x => {                       // Abramowitz & Stegun 7.1.26
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
    - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
};
/** Expected tier points across the distribution of plausible final scores. */
function expectedPaPoints(mu, sc, sd) {
  sd = sd || 9.5;
  let total = 0;
  for (const [lo, hi, key] of PA_BANDS) {
    const v = sc && sc[key] != null ? sc[key] : 0;
    const zl = (lo - 0.5 - mu) / sd, zh = (hi + 0.5 - mu) / sd;
    total += 0.5 * (erf(zh / Math.SQRT2) - erf(zl / Math.SQRT2)) * v;
  }
  return total;
}

/** This week's projection, in this league's points. */
function pj(p) {
  if (!p) return null;
  const sc = scoringOf(S.league);

  if (p.pos === "DST") {
    if (!sc || !p.dst_ctx) return p.proj ?? null;
    const c = p.dst_ctx;
    return Math.round((
      expectedPaPoints(c.opp_implied, sc)
      + c.sack_rate * (sc.sack ?? 1)
      + c.ta_rate * (((sc.int ?? 2) + (sc.fum_rec ?? 2)) / 2)
      + 0.06 * (sc.def_td ?? 6)
      + 0.35) * 100) / 100;
  }

  if (p.pstats && sc) {
    const v = scoreLine(p.pstats, sc);
    if (v != null) return Math.round(v * 100) / 100;
  }

  // No stat line for this player: fall back to the shipped PPR number, with
  // the reception premium backed out if the league pays less than a point.
  if (p.proj == null) return null;
  const rec = sc && typeof sc.rec === "number" ? sc.rec : 1;
  const perGameRec = (p.pos === "DST" || p.pos === "K") ? 0
    : (p.g ? (p.rec || 0) / p.g : 0);
  return Math.max(0, p.proj - (1 - rec) * perGameRec);
}

/** Whether this player's number came from a real stat line or a fallback.

   A stat line built by our own model counts as a fallback even though it scores
   through the same path. Both are multiplied by this league's scoring — that is
   the point of storing lines rather than points, and it holds however the line
   was made — but only a projection feed's line is a projection. A model estimate
   keeps its ~ so the two are never read as the same thing. */
const projExact = p => !!(p && scoringOf(S.league)
  && ((p.pstats && p.pstats_src !== "model")
   || (p.pos === "DST" && p.dst_ctx)));

/** Season production, restated in this league's points. */
function seasonPts(p) {
  const sc = scoringOf(S.league);
  if (p && p.sstats && sc) {
    const v = scoreLine(p.sstats, sc);
    if (v != null) {
      let total = v;
      if (p.pos === "DST" && p.pa_log)
        total += p.pa_log.reduce((a, pa) => a + paPoints(pa, sc), 0);
      return Math.round(total * 100) / 100;
    }
  }
  return p && p.pts != null ? p.pts : null;
}
const seasonPPG = p => {
  const t = seasonPts(p);
  return (t == null || !p.g) ? null : Math.round(t / p.g * 100) / 100;
};

/* Replacement level, recomputed per league: the last player at each position
   who would actually be starting somewhere in a league this size and shape. */
let _replCache = null, _replKey = null;
function replacement() {
  const lg = S.league;
  const key = lg ? `${lg.key}:${lg.scoring}:${lg.teams}` : "none";
  if (_replKey === key && _replCache) return _replCache;
  const slots = startingSlots(lg || { roster_positions: [] });
  const n = s => slots.filter(x => x === s).length;
  const flex = slots.filter(s => ["FLEX", "WRRB_FLEX", "REC_FLEX"].includes(s)).length;
  const teams = (lg && lg.teams) || 12;
  const depth = {
    QB: (n("QB") + n("SUPER_FLEX") * 0.8) * teams,
    RB: (n("RB") + flex * 0.45) * teams,
    WR: (n("WR") + flex * 0.45) * teams,
    TE: (n("TE") + flex * 0.10) * teams,
    K: n("K") * teams, DST: n("DEF") * teams,
  };
  const out = {};
  for (const pos of Object.keys(depth)) {
    const vals = S.players.filter(p => p.pos === pos && pj(p) != null)
      .map(pj).sort((a, b) => b - a);
    const idx = Math.max(1, Math.round(depth[pos]));
    out[pos] = vals.length ? (vals[Math.min(idx, vals.length) - 1] || 0) : 0;
  }
  _replKey = key; _replCache = out;
  return out;
}

/* Points over expected, restated for this league's scoring. POE ships as PPR,
   so a half-PPR league gives back half a point for every catch above or below
   the expected reception count. */
/* POE is computed in PPR upstream. Restate it by the gap between what this
   league pays for a catch and the one point PPR assumes — the rest of the
   scoring cancels, since both sides of the subtraction use the same rates. */
const recRate = () => {
  const sc = scoringOf(S.league);
  return sc && typeof sc.rec === "number" ? sc.rec : 1;
};
function poeOf(p, perGame) {
  if (!p || p.poe == null) return null;
  const d = 1 - recRate();
  const adj = p.poe - d * ((p.rec || 0) - (p.x_rec || 0));
  return perGame ? (p.g ? adj / p.g : null) : adj;
}
const xfpOf = p => p && p.xfp != null
  ? p.xfp - (1 - recRate()) * (p.x_rec || 0) : null;
const actualOf = p => {
  const v = seasonPts(p);
  return v != null ? v : null;
};

const parOf = p => {
  const v = pj(p), r = replacement()[p.pos];
  return (v == null || r == null) ? null : Math.round((v - r) * 100) / 100;
};

/* ---------------------------------------------------------- lineup solving */
function optimalLineup(ids, lg) {
  const slots = startingSlots(lg);
  const pool = ids.map(i => S.byId.get(i)).filter(Boolean)
                  .filter(p => (pj(p) ?? 0) > 0);
  // Most restrictive slot first, then a local-search pass to fix greedy misses.
  const order = slots.map((s, i) => ({ s, i, n: (SLOTS[s] || []).length || 99 }))
                     .sort((a, b) => a.n - b.n);
  const used = new Set(), out = new Array(slots.length).fill(null);
  for (const { s, i } of order) {
    const ok = SLOTS[s] || [];
    let best = null;
    for (const p of pool) {
      if (used.has(p.id) || !ok.includes(p.pos)) continue;
      if (!best || pj(p) > pj(best)) best = p;
    }
    if (best) { used.add(best.id); out[i] = best; }
  }
  // improvement: try swapping each bench player into each slot
  let improved = true, guard = 0;
  while (improved && guard++ < 6) {
    improved = false;
    const bench = pool.filter(p => !used.has(p.id));
    for (let i = 0; i < slots.length; i++) {
      const ok = SLOTS[slots[i]] || [];
      const cur = out[i];
      for (const b of bench) {
        if (!ok.includes(b.pos)) continue;
        if (!cur || pj(b) > pj(cur)) {
          if (cur) used.delete(cur.id);
          used.add(b.id); out[i] = b; improved = true; break;
        }
      }
      if (improved) break;
    }
  }
  const total = out.reduce((a, p) => a + (pj(p) || 0), 0);
  return { slots, lineup: out, total, bench: pool.filter(p => !used.has(p.id)) };
}

const teamTotal = (ids, lg) => optimalLineup(ids, lg).total;

/* ------------------------------------------------------------ waiver score */
/* A defense has no targets, snap share or dynasty value, so the skill-position
   formula scores every one of them near zero. Stream value is a different
   question — how good is this week, and is he gettable — so it gets its own. */
function dstScore(p) {
  const par = parOf(p);
  const v = par != null ? Math.min(1, Math.max(0, (par + 3) / 7)) : 0.3;
  const form = seasonPPG(p) != null ? Math.min(1, Math.max(0, seasonPPG(p) / 14)) : 0.3;
  const scarce = p.own != null ? Math.max(0, 1 - p.own / 70) : 0.6;
  const matchup = p.dst_ctx
    ? Math.min(1, Math.max(0, (27 - p.dst_ctx.opp_implied) / 12)) : 0.4;
  return Math.round((0.36 * v + 0.30 * matchup + 0.20 * form + 0.14 * scarce) * 100);
}

function waiverScore(p) {
  if (p.pos === "DST" || p.pos === "K") return dstScore(p);
  // Each term is 0–1; weights say what actually wins a waiver claim.
  // Value is points ABOVE REPLACEMENT at the player's own position — a raw
  // rank can't compare a TE to a WR, because the pools are different sizes.
  const pv = parOf(p);
  const par    = pv != null ? Math.min(1, Math.max(0, (pv + 4) / 12)) : 0.15;
  const snap   = p.snap_last != null ? Math.min(1, p.snap_last / 85) : 0.25;
  const trend  = (p.snap_last != null && p.snap != null)
                 ? Math.min(1, Math.max(0, 0.5 + (p.snap_last - p.snap) / 40)) : 0.5;
  const usage  = p.tgt_share != null ? Math.min(1, p.tgt_share / 25)
               : (p.car ? Math.min(1, p.car / (p.g || 1) / 16) : 0.2);
  const prod   = seasonPPG(p) != null ? Math.min(1, seasonPPG(p) / 16) : 0.15;
  const scarce = p.own != null ? Math.max(0, 1 - p.own / 70) : 0.6;  // still gettable
  const dyn    = val(p) ? Math.min(1, val(p) / valueScale()) : 0;
  const s = 0.30*par + 0.14*snap + 0.12*trend + 0.13*usage
          + 0.11*prod + 0.10*scarce + 0.10*dyn;
  // Someone who can't play this week isn't a waiver priority, however good he
  // is — in a dynasty league he's a stash, which is what the low score says.
  const avail = !p.opp ? 0.55 : p.inj === "Out" ? 0.6 : p.inj === "Doubtful" ? 0.75 : 1;
  return Math.round(s * 100 * avail);
}
/** Enough signal to be worth a row at all. */
const waiverWorthy = p =>
  ((p.pos === "DST" || p.pos === "K")
    && gradedPositions(S.league || {}).includes(p.pos)) ||
  (pj(p) ?? 0) > 1 || (seasonPPG(p) ?? 0) > 2 || (p.snap_last ?? 0) > 20 || (val(p) ?? 0) > valueScale() / 10;

const faabPct = (s, p) => {
  const bid = s >= 78 ? "25–40%" : s >= 66 ? "12–22%" : s >= 54 ? "5–10%"
            : s >= 42 ? "2–4%" : s >= 30 ? "1–2%" : "$0–1 / last claim";
  // Don't recommend a real bid on someone below the startable line.
  if ((parOf(p) ?? 0) < 0 && s >= 54) return "2–5%";
  return bid;
};

/* --------------------------------------------------------- roster analysis */
/* Which positions this league actually starts — no point grading a roster at
   a spot its lineup has no slot for. */
function gradedPositions(lg) {
  const slots = startingSlots(lg);
  const out = [];
  for (const pos of ["QB", "RB", "WR", "TE", "K", "DST"]) {
    const slot = pos === "DST" ? "DEF" : pos;
    const flex = ["FLEX", "WRRB_FLEX", "REC_FLEX", "SUPER_FLEX"]
      .some(fx => slots.includes(fx) && (SLOTS[fx] || []).includes(pos));
    if (slots.includes(slot) || flex) out.push(pos);
  }
  return out;
}

/* Kickers and defenses carry no dynasty value — they're streamed, not owned —
   so grade them on what they'll score instead. Needs are percentiles within a
   position, so the two scales never meet and don't need to agree. */
const assetScore = p => !p ? 0
  : (p.pos === "DST" || p.pos === "K") ? (pj(p) || 0) : (val(p) || 0);

const POS_DEPTH = { QB: 2, RB: 4, WR: 5, TE: 1, K: 1, DST: 1 };

function positionStrength(ids, lg) {
  const out = {};
  for (const pos of gradedPositions(lg)) {
    const ps = ids.map(i => S.byId.get(i)).filter(p => p && p.pos === pos)
                  .sort((a, b) => assetScore(b) - assetScore(a));
    const depth = POS_DEPTH[pos] || 1;
    out[pos] = {
      count: ps.length,
      top: ps.slice(0, depth).reduce((a, p) => a + assetScore(p), 0),
      best: ps[0] || null,
      players: ps,
    };
  }
  return out;
}

function rosterNeeds(ids, lg) {
  const st = positionStrength(ids, lg);
  const league = S.league.rosters.map(r => positionStrength(r.players, lg));
  const needs = {};
  for (const pos of gradedPositions(lg)) {
    const all = league.map(x => x[pos].top).sort((a, b) => a - b);
    const mine = st[pos].top;
    const pct = all.length ? all.filter(v => v < mine).length / all.length : 0.5;
    needs[pos] = { pct, label: pct < 0.25 ? "need" : pct < 0.5 ? "thin"
                          : pct < 0.78 ? "solid" : "strength" };
  }
  return needs;
}

/* ------------------------------------------------------------ data loading */
async function loadJSON(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

// Try Sleeper live from the viewer's browser. Blocked by the artifact CSP in
// most cases — that is expected, and the baked-in league is the fallback.
async function trySleeper(leagueId) {
  const base = "https://api.sleeper.app/v1/league/" + encodeURIComponent(leagueId);
  const grab = async u => {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 7000);
    try { const r = await fetch(u, { signal: c.signal }); return r.ok ? r.json() : null; }
    finally { clearTimeout(t); }
  };
  const wk = S.meta.upcoming_week;
  const [lg, rs, us, mu] = await Promise.all([
    grab(base), grab(base + "/rosters"), grab(base + "/users"),
    wk ? grab(base + "/matchups/" + wk) : Promise.resolve(null)]);
  if (!lg || !rs || !us) throw new Error("no data");
  const uname = Object.fromEntries(us.map(u => [u.user_id,
    u.metadata?.team_name || u.display_name || "Team"]));
  // head-to-head pairings and this week's starters, which can differ from the
  // roster's stored list
  let matchups = null;
  if (Array.isArray(mu) && mu.length && wk) {
    const by_roster = {}, groups = {};
    for (const row of mu) {
      const rid = String(row.roster_id);
      by_roster[rid] = {
        matchup_id: row.matchup_id == null ? "" : String(row.matchup_id),
        points: row.points || 0,
        starters: (row.starters || []).map(String),
      };
      if (row.matchup_id != null) {
        const key = String(row.matchup_id);
        if (!groups[key]) groups[key] = [];
        groups[key].push(rid);
      }
    }
    matchups = { [String(wk)]: {
      pairs: Object.keys(groups).map(id => ({ matchup_id: id, rosters: groups[id] })),
      by_roster,
    } };
  }

  return {
    sample: false, source: "sleeper-live", name: lg.name, league_id: lg.league_id,
    scoring_settings: lg.scoring_settings || null,
    matchups,
    season: +lg.season, teams: lg.total_rosters,
    type: lg.settings?.type === 2 ? "dynasty" : lg.settings?.type === 1 ? "keeper" : "redraft",
    scoring: (lg.scoring_settings?.rec ?? 0) >= 1 ? "ppr"
           : (lg.scoring_settings?.rec ?? 0) > 0 ? "half" : "std",
    roster_positions: lg.roster_positions,
    my_team: null,
    rosters: rs.map(r => ({
      id: String(r.roster_id), name: uname[r.owner_id] || ("Roster " + r.roster_id),
      owner: uname[r.owner_id] || "", players: r.players || [],
      starters: r.starters || [], picks: [],
      wins: r.settings?.wins || 0, losses: r.settings?.losses || 0,
      pf: (r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100,
      pa: (r.settings?.fpts_against || 0) + (r.settings?.fpts_against_decimal || 0) / 100,
    })),
    results: [],
  };
}

/* ------------------------------------------------------------ filtering
   One filter model shared by the waiver board and the player table, so the
   two read as the same instrument. Position is a multi-select: on the waiver
   board an empty selection means the skill positions, because nobody opens a
   waiver board to look at kickers. */
const ALL_POSNS = ["QB", "RB", "WR", "TE", "K", "DST"];
/* Only offer positions the league actually starts. Showing a D/ST chip in a
   league with no D/ST slot invites a decision that doesn't exist. */
const posChips = () => {
  const g = gradedPositions(S.league || { roster_positions: [] });
  return g.length ? g : ALL_POSNS;
};
/* The waiver pool when no position chip is picked: exactly the positions this
   league starts. Streaming a defense is a real weekly decision in a league with
   a D/ST slot, and noise in one without. */
const waiverDefaultPositions = lg => gradedPositions(lg || { roster_positions: [] });

const FILT_DEFAULTS = {
  waiver: { q: "", pos: [], team: "", avail: "fa", needs: false, minProj: 0,
            sort: "ws", dir: -1 },
  players: { q: "", pos: [], team: "", owner: "all", maxAge: 0, inj: "any",
             sort: "proj", dir: -1 },     // "proj" is in every column set
};
const FILT = {
  waiver: { ...FILT_DEFAULTS.waiver, pos: [] },
  players: { ...FILT_DEFAULTS.players, pos: [] },
};

function saveFilters() {
  try { localStorage.setItem("sacko.filters", JSON.stringify(FILT)); } catch {}
}
function restoreFilters() {
  try {
    const raw = JSON.parse(localStorage.getItem("sacko.filters") || "null");
    if (!raw) return;
    for (const scope of ["waiver", "players"])
      if (raw[scope]) Object.assign(FILT[scope], raw[scope],
        { pos: Array.isArray(raw[scope].pos) ? raw[scope].pos : [] });
  } catch {}
}

const nflTeams = () => [...new Set(S.players.map(p => p.team))]
  .filter(t => t && t !== "FA").sort();

const filtersActive = scope => {
  const f = FILT[scope], d = FILT_DEFAULTS[scope];
  return Object.keys(d).some(k => k === "sort" || k === "dir" ? false
    : k === "pos" ? f.pos.length : f[k] !== d[k]);
};

/** Everything the two tabs filter on in common. */
function baseFilter(scope, list) {
  const f = FILT[scope];
  // a chip saved under another league may name a position this one never starts
  const allowed = posChips();
  if (f.pos.length) {
    const kept = f.pos.filter(p => allowed.includes(p));
    if (kept.length !== f.pos.length) f.pos = kept;
  }
  const pos = f.pos.length ? f.pos
    : (scope === "waiver" ? waiverDefaultPositions(S.league) : null);
  if (f.q) list = list.filter(p => p.name.toLowerCase().includes(f.q));
  if (pos) list = list.filter(p => pos.includes(p.pos));
  if (f.team) list = list.filter(p => p.team === f.team);
  return list;
}

/**
 * The filter block. `extra` carries the controls only one tab needs, plus the
 * line that says how much of the pool survived.
 */
function filterBar(scope, extra) {
  const f = FILT[scope];
  return `<div class="filters">
    <div class="row" style="gap:8px">
      <input type="search" data-f="${scope}:q" value="${esc(f.q)}"
        placeholder="Search players…" style="flex:1; min-width:140px"
        aria-label="Search players">
      ${filtersActive(scope)
        ? `<button class="btn ghost sm" data-fclear="${scope}">Clear</button>` : ""}
    </div>
    <div class="chips" role="group" aria-label="Position">
      ${posChips().map(p => `<button class="fchip" type="button" data-fpos="${scope}:${p}"
        aria-pressed="${f.pos.includes(p)}">${p}</button>`).join("")}
    </div>
    <div class="fgrid">
      <select data-f="${scope}:team" aria-label="NFL team">
        <option value="">Any NFL team</option>
        ${nflTeams().map(t => `<option ${f.team === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      ${extra.controls || ""}
    </div>
    <div class="fcount">${extra.count}</div>
  </div>`;
}

function wireFilters(scope, rerender) {
  const root = $("#p-" + scope);
  $$("[data-f]", root).forEach(el => {
    const key = el.dataset.f.split(":")[1];
    const isText = el.tagName === "INPUT" && el.type !== "checkbox";
    el.addEventListener(isText ? "input" : "change", () => {
      const f = FILT[scope];
      f[key] = el.type === "checkbox" ? el.checked
        : el.type === "number" ? (+el.value || 0)
        : key === "q" ? el.value.toLowerCase() : el.value;
      saveFilters(); rerender();
      if (isText) {                       // keep typing where they left off
        const back = $(`[data-f="${scope}:${key}"]`);
        if (back) { back.focus(); try { back.setSelectionRange(back.value.length,
          back.value.length); } catch {} }
      }
    });
  });
  $$("[data-fpos]", root).forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.fpos.split(":")[1], f = FILT[scope];
    f.pos = f.pos.includes(p) ? f.pos.filter(x => x !== p) : [...f.pos, p];
    saveFilters(); rerender();
  }));
  const clear = $(`[data-fclear="${scope}"]`, root);
  if (clear) clear.addEventListener("click", () => {
    Object.assign(FILT[scope], FILT_DEFAULTS[scope], { pos: [] });
    saveFilters(); rerender();
  });
  $$("[data-sort]", root).forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.sort, f = FILT[scope];
    if (f.sort === k) f.dir *= -1; else { f.sort = k; f.dir = -1; }
    saveFilters(); rerender();
  }));
}

/** Sort a list by a key that may be a stored field or a derived number. */
function sortBy(list, key, dir, derived) {
  return list.sort((a, b) => {
    const x = derived(a, key), y = derived(b, key);
    if (typeof x === "string" || typeof y === "string")
      return String(x ?? "").localeCompare(String(y ?? "")) * dir;
    return ((y ?? -Infinity) - (x ?? -Infinity)) * (dir === -1 ? 1 : -1);
  });
}

/* ------------------------------------------------------------ ESPN loading */
/* ESPN grants permission per `view`, not per league: a private league can
   refuse mSettings while still serving mTeam and mRoster. So each view is
   fetched on its own and a refusal degrades that one piece. */
const ESPN_SLOT = {
  0: "QB", 1: "QB", 2: "RB", 3: "WRRB_FLEX", 4: "WR", 5: "REC_FLEX", 6: "TE",
  7: "SUPER_FLEX", 16: "DEF", 17: "K", 20: "BN", 21: "IR", 23: "FLEX", 24: "IR",
};
const ESPN_POS = { 1: "QB", 2: "RB", 3: "WR", 4: "TE", 5: "K", 16: "DST" };

const nameKey = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, "")
  .replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim();

let _espnIdx = null;
function espnIndex() {
  if (_espnIdx) return _espnIdx;
  const byEspn = new Map(), byName = new Map(), byTeam = new Map();
  for (const p of S.players) {
    if (p.espn) byEspn.set(String(p.espn), p);
    byName.set(p.key + "|" + p.pos, p);
    if (p.pos !== "DST") continue;
    // Not one defense in the database carries an ESPN id, and ESPN names them
    // "Vikings D/ST" while we key them "MIN". Index every form, and keep a
    // team-code map so proTeamId can answer without going through a name.
    byTeam.set(p.team, p);
    const nick = TEAM_NICK[p.team];
    for (const form of [p.team, nick, nick && nick + " dst",
                        nick && nick + " d st", p.team + " dst"]) {
      if (form) byName.set(nameKey(form) + "|DST", p);
    }
  }
  _espnIdx = { byEspn, byName, byTeam };
  return _espnIdx;
}

/** ESPN player entry -> our player, by id first and name as the safety net. */
function matchEspn(entry) {
  const { byEspn, byName, byTeam } = espnIndex();
  const pl = entry.playerPoolEntry ? entry.playerPoolEntry.player : entry.player;
  if (!pl) return null;
  const pos = ESPN_POS[pl.defaultPositionId];

  /* Defenses are resolved before anything else, and by TEAM rather than by
     name. ESPN gives a defense a negative player id (-16000 minus its pro-team
     id) and a name like "Vikings D/ST"; our database has neither of those. The
     old code tried the name and the first word, matched nothing, and dropped
     every defense on the floor — a roster came back complete except that the
     D/ST slot was empty, which is exactly what it looked like from outside. */
  if (pos === "DST" || (pl.id != null && Number(pl.id) < 0)) {
    const id = Number(pl.id);
    const code = ESPN_PRO_TEAM[pl.proTeamId]
      || (id < 0 ? ESPN_PRO_TEAM[-id - 16000] : null);
    const hit = code && byTeam.get(code);
    if (hit) return hit;
    const nm = nameKey(pl.fullName || "");
    return byName.get(nm + "|DST")
        || byName.get(nameKey(nm.replace(/\bd ?st\b/g, "")) + "|DST")
        || null;
  }

  const hit = byEspn.get(String(pl.id));
  if (hit) return hit;
  if (!pos) return null;
  return byName.get(nameKey(pl.fullName) + "|" + pos) || null;
}

async function tryEspn(leagueId, season) {
  season = season || S.meta.season || new Date().getFullYear();
  const base = "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/"
    + season + "/segments/0/leagues/" + encodeURIComponent(leagueId);

  // Signed-in viewers carry espn_s2/SWID; send them when the browser allows,
  // and fall back to an anonymous read when it doesn't.
  const get = async views => {
    const url = base + (views.length ? "?" + views.map(v => "view=" + v).join("&") : "");
    for (const creds of ["include", "omit"]) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 12000);
      try {
        const r = await fetch(url, { credentials: creds, signal: ctl.signal });
        if (r.ok) return r.json();
        if (r.status === 401 || r.status === 403) continue;   // try anonymously
        return null;
      } catch { /* CORS, offline, or timed out — fall through */ }
      finally { clearTimeout(timer); }
    }
    return null;
  };

  const [root, teamView, rosterView, settingsView] = await Promise.all(
    [get([]), get(["mTeam"]), get(["mRoster"]), get(["mSettings"])]);

  if (!root && !teamView) {
    throw new Error("ESPN didn't answer for league " + leagueId
      + ". Check the ID and season, and that you're signed in to ESPN in this browser.");
  }

  const settings = (settingsView && settingsView.settings) || (root && root.settings) || {};
  const teams = (teamView && teamView.teams) || (root && root.teams) || [];
  const rosters = (rosterView && rosterView.teams) || [];
  const rosterById = new Map(rosters.map(t => [t.id, t]));

  const members = new Map(((teamView || root || {}).members || [])
    .map(m => [m.id, m.displayName]));

  /* Scoring. A label alone isn't enough: a league loaded from ESPN that carried
     only "half" fell straight back to DEFAULT_SCORING, so every projection was
     computed at 4 points a passing touchdown and a full point a catch — the
     league's own numbers were right there in the payload and thrown away.
     Only statIds whose meaning is certain are mapped; ESPN's defensive ids are
     undocumented, so those fall through to the defaults via scoring_partial. */
  const ESPN_STAT = {
    3: "pass_yd", 4: "pass_td", 19: "pass_2pt", 20: "pass_int",
    24: "rush_yd", 25: "rush_td", 26: "rush_2pt",
    42: "rec_yd", 43: "rec_td", 44: "rec_2pt", 53: "rec",
    72: "fum_lost",
    77: "fgm_40_49", 85: "fgmiss", 86: "xpm", 88: "xpmiss", 198: "fgm_50p",
  };
  let scoring = "unknown", scoringTable = null;
  const items = settings.scoringSettings && settings.scoringSettings.scoringItems;
  if (items) {
    const rec = items.find(i => i.statId === 53);
    const v = rec ? (rec.points ?? 0) : 0;
    scoring = v >= 1 ? "ppr" : v > 0 ? "half" : "std";
    scoringTable = {};
    for (const it of items) {
      const pts = it.points ?? 0;
      if (ESPN_STAT[it.statId]) scoringTable[ESPN_STAT[it.statId]] = pts;
      if (it.statId === 80)              // ESPN bands every FG under 40 together
        scoringTable.fgm_0_19 = scoringTable.fgm_20_29 = scoringTable.fgm_30_39 = pts;
    }
    if (!Object.keys(scoringTable).length) scoringTable = null;
  }

  // roster shape: from settings when served, else inferred from the entries
  let positions = [];
  const counts = settings.rosterSettings && settings.rosterSettings.lineupSlotCounts;
  if (counts) {
    for (const [slot, n] of Object.entries(counts)) {
      const name = ESPN_SLOT[+slot];
      if (name) for (let i = 0; i < n; i++) positions.push(name);
    }
  } else if (rosters.length) {
    const seen = {};
    for (const e of (rosters[0].roster || {}).entries || [])
      seen[e.lineupSlotId] = (seen[e.lineupSlotId] || 0) + 1;
    for (const [slot, n] of Object.entries(seen)) {
      const name = ESPN_SLOT[+slot];
      if (name) for (let i = 0; i < n; i++) positions.push(name);
    }
  }
  if (!positions.length)
    positions = ["QB", "RB", "RB", "WR", "WR", "TE", "FLEX", "DEF", "K"]
      .concat(Array(7).fill("BN"));
  const order = ["QB", "RB", "WR", "TE", "WRRB_FLEX", "REC_FLEX", "FLEX",
                 "SUPER_FLEX", "DEF", "K", "BN", "IR"];
  positions.sort((a, b) => order.indexOf(a) - order.indexOf(b));

  let matched = 0, total = 0;
  const built = teams.map(t => {
    const rt = rosterById.get(t.id) || t;
    const entries = ((rt.roster || {}).entries) || [];
    const players = [], starters = [];
    for (const e of entries) {
      total++;
      const p = matchEspn(e);
      if (!p) continue;
      matched++;
      players.push(p.id);
      const slot = ESPN_SLOT[e.lineupSlotId];
      if (slot && slot !== "BN" && slot !== "IR") starters.push(p.id);
    }
    const rec = (t.record && t.record.overall) || {};
    return {
      id: String(t.id),
      name: t.name || [t.location, t.nickname].filter(Boolean).join(" ") || ("Team " + t.id),
      owner: members.get(t.primaryOwner) || "",
      players, starters, picks: [],
      wins: rec.wins || 0, losses: rec.losses || 0,
      pf: Math.round((rec.pointsFor || 0) * 100) / 100,
      pa: Math.round((rec.pointsAgainst || 0) * 100) / 100,
    };
  });

  let gotRosters = built.some(r => r.players.length > 3);

  /* If this league starts a defense and the fetch came back without a single
     one, the roster read is not trustworthy however complete it looks — that
     is precisely the failure that emptied the D/ST slot while every skill
     player arrived intact. Report standings only, so the guards upstream keep
     whatever better data is already loaded. */
  const startsDef = positions.includes("DEF");
  const anyDst = built.some(r => r.players.some(i => {
    const pp = S.byId.get(i); return pp && pp.pos === "DST";
  }));
  const dstMissing = gotRosters && startsDef && !anyDst;
  if (dstMissing) gotRosters = false;

  return {
    key: "espn-" + leagueId, sample: false, source: "espn", platform: "ESPN",
    scoring_settings: scoringTable, scoring_partial: !!scoringTable,
    name: settings.name || (root && root.settings && root.settings.name) || ("ESPN " + leagueId),
    league_id: String(leagueId), season: +season,
    type: settings.draftSettings && settings.draftSettings.keeperCount ? "keeper" : "redraft",
    teams: built.length, scoring, roster_positions: positions,
    my_team: null,
    status: gotRosters ? "full" : "standings_only",
    note: gotRosters ? "" : dstMissing
      ? "ESPN returned rosters for this league but no defenses, so the read was "
        + "discarded rather than trusted — the rosters already loaded are kept."
      : "ESPN served this league's standings but not its rosters. If you're signed in "
      + "to ESPN in this browser, reload and try again.",
    rosters: built, results: [],
    match_rate: total ? Math.round(matched / total * 100) : null,
  };
}

const me = () => S.league.rosters.find(r => r.id === S.myTeam) || S.league.rosters[0];

function injChip(p) {
  if (!p.inj) return "";
  const cls = p.inj === "Out" ? "bad" : p.inj === "Doubtful" ? "bad" : "warn";
  const wk = S.meta.sources?.injuries_week;
